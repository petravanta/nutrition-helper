<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutrition Helper</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
:root{--accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde4d6; --ok:#11897a; --over:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}}
:root[data-theme="dark"]{--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}
/* Layout: sticky header with tabs over one working column. Today shows the day's budget, the food search, entries and weigh-in.
   Picking a food, scanning, quick add and food editing open in the side sheet (bottom sheet on phones). */
input[type=date],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;font-weight:500;min-width:0}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h2{margin-right:auto}
.nav-btn{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.budget{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.budget{grid-template-columns:repeat(2,minmax(0,1fr))}.budget .m:first-child{grid-column:1/-1}}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m .big{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.m .big small{font-size:13px;color:var(--muted);font-weight:400}
.m .rem{font-size:13px;color:var(--muted)}
.m .rem b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.m.over .rem b{color:var(--over)}
.m.over .meter i{background:var(--over)}
.m.done .rem b{color:var(--ok)}
.m.done .meter i{background:var(--ok)}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
@media (max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .wide{grid-column:1/-1}}
.drawer .form{grid-template-columns:repeat(2,minmax(0,1fr))}
.drawer .form .wide{grid-column:1/-1}
.form input,.form select{width:100%}
.entries{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .nm{font-weight:600;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
button.nm:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ent .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.ent .kc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.x-btn{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x-btn:hover{color:var(--danger);background:var(--sunk)}
.wrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:first-child{border-top:0}
.wrow .d{font-size:13px;color:var(--muted)}
.wrow .v{font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.brand svg .leaf{fill:var(--surface)}
/* food search */
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input{flex:1 1 220px}
.results{display:flex;flex-direction:column;gap:14px}
.rgroup h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;color:var(--ink)}
.rgroup .food:first-of-type{border-top:0}
.food:hover .fn{color:var(--accent)}
.food .fn{font-weight:600;overflow-wrap:anywhere}
.food .fb{font-size:12px;color:var(--muted)}
.food .fk{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.src-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.preview div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.preview b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px}
.preview span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:400px){.preview{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.qty input,.qty select{width:100%;font-size:18px}
.scanbox{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox::after{content:"";position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.note{font-size:13px;color:var(--muted)}
/* charts: colors validated for both themes (scale dots stay neutral; goal path also dashed) */
:root{--c-a:#c2410c;--c-b:#2f6fd0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-a:#e06a2e;--c-b:#5b8de0}}
:root[data-theme="dark"]{--c-a:#e06a2e;--c-b:#5b8de0}
.chart{position:relative;min-height:120px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .bar.c-a{fill:var(--c-a)}
.chart .dot.c-a{fill:var(--c-a)} .chart .dot.c-faint{fill:var(--faint)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.c-a{stroke:var(--c-a)} .chart .ln.c-b{stroke:var(--c-b)} .chart .ln.c-ink{stroke:var(--ink);stroke-width:1.5}
.chart .ln.dash{stroke-dasharray:6 4} .chart .ln.step{stroke-dasharray:3 3}
.chart .cross{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent;outline:none}
.chart .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.tip{position:absolute;top:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:140px;z-index:5}
.tip-h{color:var(--muted);margin-bottom:4px}
.tip-r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip-r b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.tip-r span{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.key{display:inline-block;width:14px;height:0;border-top:2px solid}
.key.bar{height:10px;border:0;border-radius:2px;width:10px}
.key.dots{width:7px;height:7px;border:0;border-radius:50%}
.key.dash{border-top-style:dashed} .key.step{border-top-style:dotted}
.key.c-a{border-color:var(--c-a)} .key.c-b{border-color:var(--c-b)} .key.c-ink{border-color:var(--ink)} .key.c-faint{border-color:var(--faint)}
.key.bar.c-a,.key.dots.c-a{background:var(--c-a)} .key.dots.c-faint{background:var(--faint)}
.tbl{max-height:260px;overflow:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
details summary{cursor:pointer}
.allnut h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
.allnut table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.allnut td{padding:3px 0;border-bottom:1px solid var(--line)} .allnut td:last-child{text-align:right;font-family:var(--f-mono)}
.paces{display:flex;flex-direction:column;gap:6px}
.pace{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pace:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pace .pn{font-weight:600}
.pace .pd{font-size:12px;color:var(--muted);grid-column:2}
.pace .pk{font-family:var(--f-mono);grid-row:1/span 2;grid-column:3;text-align:right}
.cmp{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.cmp .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp b{font-family:var(--f-mono);font-weight:500}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-1px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="13" fill="var(--accent)"/><path class="leaf" d="M16 10c3.5-4 8-3.5 8-3.5s.5 4.5-3.5 8c-2 1.7-4.5 1.5-4.5 1.5S15.6 12 16 10z"/><circle cx="16" cy="19" r="4" fill="var(--surface)"/></svg>
        Nutrition Helper
      </div>
      <span class="save-state" id="saveState">Loading…</span>
      <button class="btn sm" id="driveResume" data-act="driveSync" hidden>Resume Drive sync</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="weight" aria-selected="false">Weight</button>
      <button role="tab" data-tab="trends" aria-selected="false">Trends</button>
      <button role="tab" data-tab="foods" aria-selected="false">Foods</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- Metrics ---------------- */
// Budgets: calories, fat and carbs are targets; protein is a floor to reach; sodium is a ceiling to stay under.
const METRICS=[
  {k:'kcal',n:'Calories',s:'kcal',u:'kcal',kind:'target'},
  {k:'protein',n:'Protein',s:'Protein',u:'g',kind:'floor'},

function offExtras(n,pick){

  const names=new Set(Object.keys(n).map(k=>k.match(/^(.+?)_(100g|serving)$/)).filter(Boolean).map(m=>m[1]));

  const sq=num(p.serving_quantity), liquid=/^(ml|cl|l)$/i.test(p.serving_quantity_unit||p.product_quantity_unit||'');

const KCAL_PER_KG=7700, TREND_ALPHA=0.1, TDEE_WINDOW=21, TDEE_ALPHA=0.1;

  const days=[];

    let trend=null, tdee=null, dataDays=0;
    for(let d=all[0]; d<=today; d=addDays(d,1)){
      const s=scale[d];

      const row={date:d,scale:s?s.kg:null,fat:s&&s.fat!=null?s.fat:null,trend,intake:intake[d]||null,tdee:null};
      days.push(row);

      // Today is still being logged, so it doesn't count yet
      if(d!==today&&i>=TDEE_WINDOW){
        const start=days[i-TDEE_WINDOW].trend, win=days.slice(i-TDEE_WINDOW+1,i+1).filter(r=>r.intake);
        if(start!=null&&trend!=null&&win.length>=TDEE_WINDOW*0.6){
          const raw=win.reduce((a,r)=>a+r.intake.kcal,0)/win.length-(trend-start)*KCAL_PER_KG/TDEE_WINDOW;
          tdee=tdee==null?raw:tdee+TDEE_ALPHA*(raw-tdee); dataDays++;
        }
      }
      row.tdee=tdee;
    }
    MODEL={days,byDate:Object.fromEntries(days.map(r=>[r.date,r])),dataDays};
  }else MODEL={days,byDate:{},dataDays:0};
  const last=days[days.length-1];
  MODEL.trendNow=last?last.trend:null;
  MODEL.tdeeNow=last&&last.tdee!=null?Math.round(last.tdee):null;
  return MODEL;
}
// Daily calories for a pace: expenditure plus the energy of the weekly change, never below resting needs when losing
function planFor(ratePct){
  const M=model(), kg=M.trendNow; if(kg==null||M.tdeeNow==null) return null;
  const weeklyKg=kg*ratePct/100, want=M.tdeeNow+weeklyKg*KCAL_PER_KG/7;
  const floor=ratePct<0?Math.max(1200,Math.round(bmrFor(kg)||0)):0;
  return {ratePct,weeklyKg,kcal:Math.round(Math.max(want,floor)/10)*10,clamped:want<floor};
}
function goalTiming(targetKg,ratePct){
  const kg=model().trendNow; if(kg==null||!ratePct) return null;
  const weeks=(targetKg-kg)/(kg*ratePct/100);
  return weeks>0?{weeks,date:addDays(todayKey(),Math.ceil(weeks*7))}:null;
}
function macrosFor(kcal){
  const g=state.settings.goal, kg=model().trendNow, cur=targetsFor(todayKey());
  const protein=Math.round((g.proteinPerKg||1.8)*kg), fat=Math.round(kcal*(g.fatPct||30)/100/9);
  return {kcal,protein,fat,carbs:Math.max(0,Math.round((kcal-protein*4-fat*9)/4)),sodium:cur.sodium};
}
const goalReached=g=>{const kg=model().trendNow; return kg!=null&&(g.ratePct<0?kg<=g.targetKg:g.ratePct>0?kg>=g.targetKg:false)};
// The planned path from where the goal started, at the pace chosen then, flat once the target is reached
function setpointOn(d){
  const g=state.settings.goal; if(!g||!g.startDate||d<g.startDate||g.startKg==null) return null;
  const w=g.startKg+g.startKg*g.ratePct/100*daysBetween(g.startDate,d)/7;
  return g.ratePct<0?Math.max(w,g.targetKg):g.ratePct>0?Math.min(w,g.targetKg):g.startKg;
}
function proposal(){
  const g=state.settings.goal; if(!g) return null;
  const rate=goalReached(g)?0:g.ratePct, p=planFor(rate); if(!p) return null;
  return {...p,targets:macrosFor(p.kcal),reached:rate===0&&g.ratePct!==0};
}
const lastCheckin=()=>[...state.checkins].sort((a,b)=>a.date<b.date?1:-1)[0];
function checkinDue(){

}

// Uses the drive.file scope, so the app can only see the one file it creates.
const DRIVE_FILE='Nutrition Helper data.json', DAPI='https://www.googleapis.com';
const Drive={token:null,exp:0,fileId:lsGet('nh.driveFile'),on:!!lsGet('nh.driveOn'),busy:false,last:null,timer:null,err:null,lastAsk:0};
// Keep the short-lived Google token across reloads so reopening the app doesn't pause sync
(()=>{const t=lsGet('nh.driveTok'); if(Drive.on&&t&&t.exp>Date.now()){Drive.token=t.token;Drive.exp=t.exp}})();
const driveConfigured=()=>!!GOOGLE_CLIENT_ID;
const driveLive=()=>!!Drive.token&&Date.now()<Drive.exp;
function loadGis(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.onload=res; sc.onerror=()=>rej(new Error('gis')); document.head.appendChild(sc)})}
function driveToken(){return new Promise(async(res,rej)=>{
  try{await loadGis()}catch(e){return rej(e)}
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error) return rej(r); Drive.token=r.access_token; Drive.exp=Date.now()+(Number(r.expires_in||3600)-60)*1000; lsSet('nh.driveTok',{token:Drive.token,exp:Drive.exp}); res()},
    error_callback:rej});
  c.requestAccessToken({prompt:Drive.on?'':'consent'});
})}
async function dfetch(path,opt={}){
  if(!driveLive()) throw {code:'expired'};
  const r=await fetch(DAPI+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+Drive.token}});
  if(r.status===401){Drive.token=null; lsSet('nh.driveTok',null); throw {code:'expired'}}
  if(!r.ok) throw {code:'http',status:r.status};
  return r;
}
async function driveFind(){
  if(Drive.fileId){
    try{const j=await (await dfetch(`/drive/v3/files/${Drive.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return Drive.fileId}
    catch(e){if(e.code==='expired') throw e}
  }
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j=await (await dfetch(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
  Drive.fileId=j.files&&j.files[0]?j.files[0].id:null; lsSet('nh.driveFile',Drive.fileId);
  return Drive.fileId;
}
const snapshot=()=>({app:'nutrition-helper',v:1,saved:nowIso(),...state});
async function driveRead(){const id=await driveFind(); return id?(await dfetch(`/drive/v3/files/${id}?alt=media`)).json():null}
async function driveWrite(){
  const body=JSON.stringify(snapshot());
  const id=await driveFind();
  if(id){await dfetch(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
  const b='nh'+uid6(), meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
  const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j=await (await dfetch('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi})).json();
  Drive.fileId=j.id; lsSet('nh.driveFile',j.id);
}
// Combine another copy (Drive or a backup) with this browser: records from both minus deletions, the newer edit of each record, the newer settings
function mergeIn(r){
  if(!r||r.app!=='nutrition-helper') return false;
  const o=normalize(r), before=JSON.stringify(state);
  const del=new Set([...state.deleted,...o.deleted]);
  MODEL=null;
  for(const k of LISTS){
    const byId=new Map();
    [...o[k],...state[k]].forEach(x=>{if(!x.id||del.has(x.id)) return; const h=byId.get(x.id); if(!h||(x.u||'')>=(h.u||'')) byId.set(x.id,x)});
    state[k]=[...byId.values()];
  }
  state.deleted=[...del];
  if((o.settings.updatedAt||'')>(state.settings.updatedAt||'')) state.settings=o.settings;
  lsSet(LS_KEY,state);
  return JSON.stringify(state)!==before;
}
function driveStatus(){
  if(!driveConfigured()||!Drive.on) return null;
  if(Drive.busy) return 'Syncing with Google Drive…';
  if(Drive.err) return Drive.err;
  if(!driveLive()) return 'Google Drive paused';
  return 'Synced to Google Drive'+(Drive.last?' · '+Drive.last.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'');
}
function showDriveStatus(){const t=driveStatus(); setSaveState(t||'Saved in this browser'); const b=document.getElementById('driveResume'); if(b) b.hidden=!(driveConfigured()&&Drive.on&&!driveLive()&&!Drive.busy)}
async function driveSync(interactive){
  if(Drive.busy) return;
  try{
    if(!driveLive()){ if(!interactive){showDriveStatus();return} await driveToken() }
    Drive.busy=true; Drive.err=null; showDriveStatus();
    const changed=mergeIn(await driveRead());
    await driveWrite();
    Drive.on=true; lsSet('nh.driveOn',true); Drive.last=new Date();
    if(changed&&!sheet) render();
  }catch(e){
    if(e&&e.code!=='expired') Drive.err=(e.type==='popup_closed'||e.error==='access_denied')?null:'Couldn’t reach Google Drive';
    if(interactive&&Drive.err) toast('Couldn’t connect to Google Drive. Everything is still saved in this browser.');
  }finally{Drive.busy=false; showDriveStatus(); if(tab==='settings'&&!sheet) render()}
}
function driveSoon(){
  if(!driveConfigured()||!Drive.on) return;
  clearTimeout(Drive.timer);
  Drive.timer=setTimeout(async()=>{
    if(!driveLive()){showDriveStatus();return}
    try{Drive.busy=true;showDriveStatus();await driveWrite();Drive.last=new Date();Drive.err=null}
    catch(e){if(e.code!=='expired')Drive.err='Couldn’t reach Google Drive'}
    finally{Drive.busy=false;showDriveStatus()}
  },3000);
}
function driveDisconnect(){
  if(Drive.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(Drive.token,()=>{});
  Drive.token=null; Drive.on=false; Drive.err=null; lsSet('nh.driveOn',false); lsSet('nh.driveTok',null); showDriveStatus(); render();
}

// Hand-drawn SVG, sized to the card. Each chart is one measure on one axis; hovering shows every series at that date.
const RANGES=[['1m','1M',30],['3m','3M',91],['6m','6M',182],['1y','1Y',365],['all','All',0]];
let range=(()=>{try{return sessionStorage.getItem('nh.range')||'3m'}catch(_){return '3m'}})();
const CHARTS={};
const shortDate=k=>parseDay(k).toLocaleDateString([], {month:'short',day:'numeric'});
const monthYear=k=>parseDay(k).toLocaleDateString([], {month:'short',year:'2-digit'});
function niceTicks(lo,hi,n=4){
  if(lo===hi){lo-=1;hi+=1}
  const raw=(hi-lo)/n, mag=10**Math.floor(Math.log10(raw)), step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step, out=[]; for(let v=a; v<=hi+step*0.001; v+=step) out.push(+v.toFixed(6));
  if(out[out.length-1]<hi) out.push(+(out[out.length-1]+step).toFixed(6));
  return out;
}
// Rows for the chosen range: one per day, or one per week (averages) when the range is long
function chartRows(){
  const M=model(); if(!M.days.length) return {rows:[],weekly:false};
  const days=RANGES.find(r=>r[0]===range)[2], t=todayKey(), from=days?addDays(t,-days+1):M.days[0].date;
  const sel=M.days.filter(r=>r.date>=from);
  const weekly=sel.length>120;
  const row=r=>{const tg=targetsFor(r.date); return {date:r.date,scale:r.scale,trend:r.trend,bf:r.fat,tdee:r.tdee,goal:setpointOn(r.date),
    ...Object.fromEntries(METRICS.map(m=>[m.k,r.intake?r.intake[m.k]:null])),...Object.fromEntries(METRICS.map(m=>['t_'+m.k,tg[m.k]]))}};
  if(!weekly) return {rows:sel.map(row),weekly};
  const out=[];
  for(let i=0;i<sel.length;i+=7){
    const wk=sel.slice(i,i+7).map(row), avg=k=>{const v=wk.map(r=>r[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const o={date:wk[0].date,end:wk[wk.length-1].date}; Object.keys(wk[0]).forEach(k=>{if(k!=='date') o[k]=avg(k)}); o.trend=wk[wk.length-1].trend; o.goal=wk[wk.length-1].goal; o.tdee=wk[wk.length-1].tdee; out.push(o);
  }
  return {rows:out,weekly};
}
// spec: {id, title, unit, dp, rows, series:[{k, name, mark:'bar'|'line'|'dots'|'dash', color:'a'|'b'|'ink'|'faint', conv?}], zero?}
function chartCard(spec){
  CHARTS[spec.id]=spec;
  const legend=spec.series.length>1?`<div class="legend">${spec.series.map(s=>`<span><i class="key ${s.mark} c-${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  const tableRows=spec.rows.filter(r=>spec.series.some(s=>r[s.k]!=null)).slice(-60).reverse();
  return `<section class="panel stack chart-card"><h3>${esc(spec.title)}</h3>${legend}
    <div class="chart" data-chart="${spec.id}"></div>
    <details><summary class="small muted">Data table</summary><div class="tbl"><table><thead><tr><th>${spec.weekly?'Week of':'Date'}</th>${spec.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead>
      <tbody>${tableRows.map(r=>`<tr><td>${esc(shortDate(r.date))}</td>${spec.series.map(s=>`<td>${r[s.k]==null?'–':fmt(s.conv?s.conv(r[s.k]):r[s.k],spec.dp)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${spec.rows.length>60?'<p class="small muted">Latest 60 rows.</p>':''}</details>
  </section>`;
}
function drawChart(el){
  const spec=CHARTS[el.dataset.chart]; if(!spec) return;
  const rows=spec.rows, n=rows.length, W=Math.max(260,el.clientWidth), H=spec.h||180, pl=44, pr=10, pt=8, pb=22;
  const val=(s,r)=>r[s.k]==null?null:(s.conv?s.conv(r[s.k]):r[s.k]);
  const vals=spec.series.flatMap(s=>rows.map(r=>val(s,r))).filter(v=>v!=null);
  if(!vals.length){el.innerHTML='<p class="empty">No data in this range yet.</p>';return}
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(spec.zero) lo=Math.min(0,lo); else {const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad}
  const ticks=niceTicks(lo,hi); lo=spec.zero?0:ticks[0]; hi=ticks[ticks.length-1];
  const bw=(W-pl-pr)/n, x=i=>pl+(i+0.5)*bw, y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let g=ticks.filter(v=>v>=lo&&v<=hi).map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v,hi-lo<5?1:0)}</text>`).join('');
  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((W-pl)/70)))), lab=spec.weekly||n>120?monthYear:shortDate;
  for(let i=0;i<n;i+=every) g+=`<text class="tick" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(lab(rows[i].date))}</text>`;
  for(const s of spec.series){
    const pts=rows.map((r,i)=>[i,val(s,r)]);
    if(s.mark==='bar'){
      const w=Math.max(1,Math.min(16,bw-2)), r0=Math.min(2,w/2);
      g+=pts.filter(p=>p[1]!=null).map(([i,v])=>{const top=y(Math.max(v,lo)), h=Math.max(0,y(lo)-top); return `<path class="bar c-${s.color}" d="M${x(i)-w/2},${top+h}V${top+r0}q0,-${r0} ${r0},-${r0}h${w-2*r0}q${r0},0 ${r0},${r0}V${top+h}Z"/>`}).join('');
    }else if(s.mark==='dots'){
      g+=pts.filter(p=>p[1]!=null).map(([i,v])=>`<circle class="dot c-${s.color}" cx="${x(i)}" cy="${y(v)}" r="${n>200?2:3}"/>`).join('');
    }else{
      let d='', pen=false;
      for(const [i,v] of pts){if(v==null){pen=false;continue} d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); pen=true}
      // a target is a step: hold each value across its whole slot
      if(s.mark==='step'){d='';pen=false;for(const [i,v] of pts){if(v==null){pen=false;continue} const a=x(i)-bw/2,b=x(i)+bw/2; d+=(pen?'L':'M')+a.toFixed(1)+','+y(v).toFixed(1)+'L'+b.toFixed(1)+','+y(v).toFixed(1); pen=true}}
      g+=`<path class="ln ${s.mark} c-${s.color}" d="${d}"/>`;
    }
  }
  g+=`<line class="cross" id="x-${spec.id}" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)} chart. The data table below lists the values.">${g}<rect class="hit" x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" tabindex="0"/></svg><div class="tip" hidden></div>`;
  el._geo={pl,bw,n,x,W};
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(drawChart)}
function chartHover(el,clientX){
  const spec=CHARTS[el.dataset.chart], geo=el._geo; if(!spec||!geo) return;
  const box=el.getBoundingClientRect(), i=Math.max(0,Math.min(geo.n-1,Math.floor((clientX-box.left-geo.pl)/geo.bw)));
  const r=spec.rows[i], cx=geo.x(i), line=el.querySelector('.cross'), tip=el.querySelector('.tip');
  line.setAttribute('x1',cx); line.setAttribute('x2',cx); line.setAttribute('visibility','visible');
  tip.replaceChildren();
  const head=document.createElement('div'); head.className='tip-h';
  head.textContent=spec.weekly?`Week of ${shortDate(r.date)}`:dayLabel(r.date); tip.append(head);
  for(const s of spec.series){
    const v=r[s.k]; const row=document.createElement('div'); row.className='tip-r';
    const key=document.createElement('i'); key.className=`key ${s.mark} c-${s.color}`;
    const b=document.createElement('b'); b.textContent=v==null?'–':`${fmt(s.conv?s.conv(v):v,spec.dp)} ${spec.unit}`;
    const nm=document.createElement('span'); nm.textContent=s.name;

  tip.hidden=false;
  const tw=tip.offsetWidth; tip.style.left=Math.max(0,Math.min(geo.W-tw,cx+12>geo.W-tw?cx-tw-12:cx+12))+'px';
}
function chartLeave(el){const l=el.querySelector('.cross'), t=el.querySelector('.tip'); if(l) l.setAttribute('visibility','hidden'); if(t) t.hidden=true}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-chart]'); document.querySelectorAll('[data-chart]').forEach(c=>{if(c!==el) chartLeave(c)}); if(el) chartHover(el,e.clientX)});
document.addEventListener('pointerleave',e=>{if(e.target.matches&&e.target.matches('.hit')) chartLeave(e.target.closest('[data-chart]'))},true);
document.addEventListener('keydown',e=>{
  if(!e.target.matches||!e.target.matches('.hit')||!['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const el=e.target.closest('[data-chart]'), g=el._geo; e.preventDefault();

let resizeT=null; window.addEventListener('resize',()=>{clearTimeout(resizeT); resizeT=setTimeout(drawCharts,150)});

// Reads MacroFactor's .xlsx export in the browser (SheetJS from cdnjs); nothing leaves the device.
// Daily totals become one entry per day, scale weights become weigh-ins, custom foods and favorites join My foods.
// Ids are derived from dates and names, so importing the same export again updates rather than duplicates.
function loadSheetJs(){return new Promise((res,rej)=>{
  if(window.XLSX) return res(window.XLSX);
  const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function cellDay(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5); return dkey(d)}   // SheetJS dates can land just before local midnight
  if(typeof v==='number'&&v>20000&&v<80000) return dkey(new Date(Math.round((v-25569)*864e5)+12*36e5+new Date().getTimezoneOffset()*6e4));   // a date cell that lost its date format
  const s=String(v??'').trim(), m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)||s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  return m[1].length===4?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:`${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
}
// Find a column by the start of its header, e.g. col(row,/^calories/)
const col=(row,re)=>{const k=Object.keys(row).find(h=>re.test(h.trim().toLowerCase())); return k==null?null:row[k]};
const colName=(rows,re)=>rows.length?Object.keys(rows[0]).find(h=>re.test(h.trim().toLowerCase())):null;
// MacroFactor names nutrient columns like "Vitamin C (mg)"; match them to the catalog by name, keep the rest as mf:<name>
const MF_NOT_NUTRIENT=/^(date|food name|serving|calories|protein|fat \(|fat$|carbs|time|meal|brand|notes?|expenditure|target|weight|trend)/;
const MF_ALIAS={'vitamin b1':'thiamin','vitamin b2':'riboflavin','vitamin b3':'niacin','vitamin b5':'pantothenic','vitamin b7':'biotin','vitamin b9':'folate',
  'folic acid':'folate','sugar':'sugars','sugars added':'addedSugars','saturated':'satFat','monounsaturated':'monoFat','polyunsaturated':'polyFat',
  'trans':'transFat','trans fat':'transFat','omega 3':'omega3','omega 6':'omega6','omega-3':'omega3','omega-6':'omega6','dietary fiber':'fiber'};
function mfNutrientKey(name){
  const s=name.toLowerCase().replace(/\s+/g,' ').trim();
  if(MF_ALIAS[s]) return MF_ALIAS[s];
  const x=NUTRIENTS.find(n=>n.n.toLowerCase()===s||n.n.toLowerCase().replace(/ \(.*\)$/,'')===s||n.k.toLowerCase()===s.replace(/ /g,''));
  return x?x.k:null;
}
function mfNutrients(row,scale){
  const per100={}, nmeta={};
  for(const h of Object.keys(row)){
    const head=h.trim(), lower=head.toLowerCase(); if(MF_NOT_NUTRIENT.test(lower)) continue;
    const v=num(row[h]); if(v==null) continue;
    const m=head.match(/^(.*?)\s*\(([^)]+)\)\s*$/), name=(m?m[1]:head).trim(), unit=normUnit(m?m[2]:'');
    const k=mfNutrientKey(name);
    if(k){const c=k==='kcal'?v:convertMass(v,unit||NUT[k].u,NUT[k].u); if(c!=null) per100[k]=c*scale; continue}
    const key='mf:'+name.toLowerCase(); per100[key]=v*scale; nmeta[key]={n:name,u:unit};
  }
  return {per100,nmeta};
}
function readMacroFactor(XLSX,buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const sheet=n=>{const k=wb.SheetNames.find(s=>s.trim().toLowerCase()===n); return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:null,raw:true}):[]};
  const macros=sheet('calories & macros'), micros=sheet('micronutrients'), scale=sheet('scale weight');
  if(!macros.length&&!scale.length) throw new Error('not-mf');
  const microsOn={}; for(const r of micros){const d=cellDay(col(r,/^date/)); if(d) microsOn[d]=mfNutrients(r,1).per100}
  const days=[];
  for(const r of macros){
    const d=cellDay(col(r,/^date/)); if(!d) continue;
    const all={...mfNutrients(r,1).per100,...(microsOn[d]||{})};
    const t={kcal:num(col(r,/^calories/))||0,protein:num(col(r,/^protein/))||0,fat:num(col(r,/^fat/))||0,carbs:num(col(r,/^carbs/))||0,sodium:all.sodium||0};
    if(t.kcal>0||t.protein>0) days.push({date:d,...t,more:moreOf(all)});
  }
  const wcol=colName(scale,/^weight/)||'', toKg=/kg/i.test(wcol)?1:KG_PER_LB;
  const weighins=[];
  for(const r of scale){
    const d=cellDay(col(r,/^date/)), w=num(col(r,/^weight/)); if(!d||!w) continue;
    let f=num(col(r,/^fat/)); if(f!=null&&f>0&&f<1) f*=100;
    weighins.push({date:d,kg:+(w*toKg).toFixed(3),fat:f||null});
  }
  const foods=new Map();
  for(const r of [...sheet('custom foods'),...sheet('favorites')]){
    const name=String(col(r,/^food name/)||'').trim(), g=num(col(r,/^serving weight/)); if(!name||!g||g<=0||foods.has(name.toLowerCase())) continue;
    const per=k=>(num(col(r,k))||0)*100/g, qty=num(col(r,/^serving qty/)), size=String(col(r,/^serving size/)||'').trim(), all=mfNutrients(r,100/g);
    foods.set(name.toLowerCase(),{name,brand:'',barcode:'',source:'custom',ext:'mf:'+name.toLowerCase(),base:'g',
      per100:{...all.per100,kcal:per(/^calories/),protein:per(/^protein/),fat:per(/^fat \(/),carbs:per(/^carbs/),sodium:all.per100.sodium||0},
      ...(Object.keys(all.nmeta).length?{nmeta:all.nmeta}:{}),
      servings:[{n:size?`${qty&&qty!==1?fmtQty(qty)+' ':''}${size}`:`${fmtQty(g)} g`,amt:g}]});
  }
  const prof=sheet('user profile')[0], profile={};
  if(prof){
    const sex=String(col(prof,/^sex/)||'').toLowerCase(), bd=cellDay(col(prof,/^birthday/)), h=num(col(prof,/^height/));
    if(sex.startsWith('f')) profile.sex='female'; else if(sex.startsWith('m')) profile.sex='male';
    if(bd) profile.birthYear=+bd.slice(0,4);
    if(h) profile.heightCm=+(h*(/cm/i.test(Object.keys(prof).find(k=>/^height/i.test(k))||'')?1:2.54)).toFixed(1);
  }
  return {days:days.sort((a,b)=>a.date<b.date?-1:1),weighins:weighins.sort((a,b)=>a.date<b.date?-1:1),foods:[...foods.values()],profile};
}
// What would change: days you've already logged in this app, and weigh-ins already here, are left alone
function importPlan(x){
  const own=new Set(state.entries.filter(e=>!e.imported).map(e=>e.date));
  const ownW=new Set(state.weighins.filter(w=>!w.imported).map(w=>w.date));
  const haveFood=new Set(state.foods.map(f=>f.name.toLowerCase()));
  return {days:x.days.filter(d=>!own.has(d.date)),weighins:x.weighins.filter(w=>!ownW.has(w.date)),foods:x.foods.filter(f=>!haveFood.has(f.name.toLowerCase())||foodByExt(f.ext)),
    skippedDays:x.days.length-x.days.filter(d=>!own.has(d.date)).length,profile:x.profile};
}
function applyImport(p){
  const u=nowIso();
  const up=(list,rec)=>{rec.u=u; const a=state[list], i=a.findIndex(r=>r.id===rec.id); i>=0?a[i]=rec:a.push(rec)};
  for(const d of p.days) up('entries',{id:'mf-'+d.date,date:d.date,ts:d.date,name:'MacroFactor daily total',imported:'macrofactor',...d});
  for(const w of p.weighins) up('weighins',{id:'mfw-'+w.date,imported:'macrofactor',...w});
  for(const f of p.foods){const have=foodByExt(f.ext); up('foods',{...(have||{uses:0}),...f,id:have?have.id:'f'+uid6()})}
  const pr=state.settings.profile;
  if(!pr.sex&&!pr.birthYear&&!pr.heightCm&&Object.keys(p.profile).length){Object.assign(pr,p.profile); state.settings.updatedAt=u}
  saveLocal();
}

async function startImport(file){

function moreHtml(f,qty,unit){

  for(const k in n){if(isMetric(k)||!n[k]) continue; const g=NUT[k]?NUT[k].g:'More'; (groups[g]||(groups[g]=[])).push(k)}
  const order=[...new Set(NUTRIENTS.map(x=>x.g)),'More'], rank=k=>NUT[k]?NUTRIENTS.indexOf(NUT[k]):1e4;
  const val=(v,u)=>`${fmt(v,v<1?2:v<10?1:0)} ${esc(u)}`;   // amounts below 0.005 show as 0
  if(!Object.keys(groups).length) return '<p class="small muted">No other nutrients listed for this food.</p>';
  return order.filter(g=>groups[g]).map(g=>`<h3>${g}</h3><table>${groups[g].sort((a,b)=>rank(a)-rank(b)||nutName(a,f.nmeta).localeCompare(nutName(b,f.nmeta)))

/* ---------------- Barcode scanning ---------------- */
// Native BarcodeDetector where the browser has it (Chrome on Android); ZXing from a CDN elsewhere (iPhone Safari).
const scan={stream:null,timer:null,zx:null,busy:false};
function loadZxing(){return new Promise((res,rej)=>{
  if(window.ZXingBrowser) return res(window.ZXingBrowser);
  const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
  sc.onload=()=>window.ZXingBrowser?res(window.ZXingBrowser):rej(new Error('zxing')); sc.onerror=()=>rej(new Error('zxing')); document.head.appendChild(sc)})}
async function startScan(){
  const v=document.getElementById('scanVideo'), note=document.getElementById('scanNote');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){note.textContent='This browser can’t use the camera. Type the barcode number instead.';return}
  try{
    if('BarcodeDetector' in window){
      const fmts=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      const want=['ean_13','ean_8','upc_a','upc_e'].filter(f=>fmts.includes(f));
      if(want.length){
        const det=new BarcodeDetector({formats:want});
        scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        if(!sheet||sheet.type!=='scan'){stopScan();return}
        v.srcObject=scan.stream; await v.play();
        scan.timer=setInterval(async()=>{if(scan.busy||v.readyState<2) return; try{const r=await det.detect(v); if(r[0]) gotBarcode(r[0].rawValue)}catch(_){}},250);
        return;
      }
    }
    const Z=await loadZxing(); if(!sheet||sheet.type!=='scan') return;
    const reader=new Z.BrowserMultiFormatReader();
    scan.zx=await reader.decodeFromConstraints({video:{facingMode:'environment'}},v,r=>{if(r&&!scan.busy) gotBarcode(r.getText())});
    if(!sheet||sheet.type!=='scan') stopScan();
  }catch(e){
    if(note) note.textContent=e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in the browser, or type the barcode number.':'Couldn’t start the camera. Type the barcode number instead.';
  }
}
function stopScan(){
  clearInterval(scan.timer); scan.timer=null; scan.busy=false;
  if(scan.zx){try{scan.zx.stop()}catch(_){} scan.zx=null}
  if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null}
}
async function gotBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(!code) return;
  scan.busy=true; if(navigator.vibrate) navigator.vibrate(40);
  const note=document.getElementById('scanNote'); if(note) note.innerHTML=`<span class="spin"></span>Looking up ${esc(code)}…`;
  const mine=foodByBarcode(code);
  if(mine){openSheet({type:'food',food:mine});return}
  try{
    const f=await offBarcode(code);
    if(!sheet||sheet.type!=='scan') return;
    if(f){openSheet({type:'food',food:foodByExt(f.ext)||f});return}
    toast('Not in Open Food Facts. Add it from the label.');
    openSheet({type:'editFood',food:{barcode:code},then:'log'});
  }catch(_){
    scan.busy=false; if(note) note.textContent=`Couldn’t reach Open Food Facts to look up ${code}. Check your connection and try again.`;
  }
}

// Online results become library foods the first time they're logged
function keepFood(f){
  if(f.id) return f;
  const have=foodByExt(f.ext); if(have) return have;
  const rec={...f,id:'f'+uid6(),uses:0}; putRecord('foods',rec); return rec;
}
function logPortion(f,qty,unit,entryId){
  f=keepFood(f);
  const amt=baseAmount(f,qty,unit), n=nutrientsFor(f,amt), old=entryId&&state.entries.find(x=>x.id===entryId);
  const rec={id:old?old.id:'e'+uid6(),date:old?old.date:day,ts:old?old.ts:nowIso(),foodId:f.id,name:f.name+(f.brand?` (${f.brand})`:''),
    qty,unit,unitLabel:unitLabel(f,unit),amt,...Object.fromEntries(METRICS.map(m=>[m.k,n[m.k]])),more:moreOf(n)};
  putRecord('entries',rec);
  Object.assign(f,{lastUnit:unit,lastQty:qty,lastAmt:amt,lastUsed:nowIso(),uses:(f.uses||0)+(old?0:1)}); putRecord('foods',f);
  const k=unitKind(unit); if(k!=='serving'&&state.settings.unitPrefs[k]!==unit){state.settings.unitPrefs[k]=unit; touchSettings()}
  return rec;
}

    state.settings.profile={sex:f.get('sex')||'',birthYear:by||null,heightCm:h?(wUnit()==='lb'?h*2.54:h):null,activity:num(f.get('activity'))||1.375};
    touchSettings(); toast('Profile saved'); render(); return}
  if(id==='usdaForm'){state.settings.usdaKey=String(f.get('key')||'').trim(); touchSettings(); toast('USDA key saved'); return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='foodQ'){search.q=t.value; clearTimeout(search.timer); search.seq++; search.off=search.usda=null; search.err={}; search.busy={off:false,usda:false}; refreshResults(); search.timer=setTimeout(runSearch,650); return}
  if(t.id==='gTarget'&&sheet&&sheet.type==='goal'){const cur=document.querySelector('#gPaces input:checked'); document.getElementById('gPaces').innerHTML=pacesHtml(num(t.value),cur?num(cur.value):null); return}
  if(t.id==='pQty'&&sheet&&sheet.type==='food'){const u=document.getElementById('pUnit').value, m=document.getElementById('pMore');
    document.getElementById('pPreview').innerHTML=previewHtml(sheet.food,t.value,u); if(m) m.innerHTML=moreHtml(sheet.food,t.value,u)}
});
// Google tokens last an hour. Renew on a tap when it's close to running out: a token request needs a tap,
// and for an account that already agreed Google's window closes by itself.
document.addEventListener('click',e=>{
  if(!driveConfigured()||!Drive.on||Drive.busy||e.target.closest('[data-act^="drive"],#driveResume')) return;
  if(Drive.exp-Date.now()>10*60000||Date.now()-Drive.lastAsk<5*60000) return;
  Drive.lastAsk=Date.now(); driveToken().then(()=>driveSync(false)).catch(()=>showDriveStatus());
},true);
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-close]'); if(!t||t.getAttribute('type')==='submit') return;
  const d=t.dataset;
  if(d.close){closeSheet();return}
  if(d.tab){tab=d.tab;pendingDelete=null;try{sessionStorage.setItem('nh.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.goto){tab=d.goto;render();window.scrollTo(0,0);return}
  if(d.day){day=addDays(day,+d.day);render();return}
  if(d.act==='goToday'){day=todayKey();render();return}
  if(d.pickfood){openSheet({type:'food',food:foodById(d.pickfood)});return}
  if(d.pickext){const [k,i]=d.pickext.split(':'), f=(search[k]||[])[+i]; if(f) openSheet({type:'food',food:foodByExt(f.ext)||f}); return}
  if(d.editent){const x=state.entries.find(e=>e.id===d.editent), f=x&&x.foodId&&foodById(x.foodId);
    openSheet(f?{type:'food',food:f,entryId:x.id}:{type:'quick',entryId:d.editent}); return}
  if(d.rment){const x=state.entries.find(e=>e.id===d.rment); dropRecord('entries',d.rment); toast(`Removed ${x?x.name:'entry'}`); if(sheet) closeSheet(); render(); return}
  if(d.act==='scan'){openSheet({type:'scan'});return}
  if(d.act==='goal'){openSheet({type:'goal'});return}
  if(d.act==='doImport'&&sheet&&sheet.plan){const p=sheet.plan; applyImport(p); closeSheet();
    toast(`Imported ${fmt(p.days.length)} days, ${fmt(p.weighins.length)} weigh-ins and ${fmt(p.foods.length)} foods`); tab='trends'; try{sessionStorage.setItem('nh.tab',tab)}catch(_){}; render(); return}
  if(d.act==='clearGoal'){state.settings.goal=null; touchSettings(); toast('Goal cleared. Your targets stay as they are.'); render(); return}
  if(d.act==='applyCheckin'||d.act==='checkinNow'){const p=proposal(); if(!p){toast('Not enough data to recalibrate yet.');return} applyProposal(p); toast(`Budget updated: ${fmt(p.targets.kcal)} kcal a day`); render(); return}
  if(d.act==='snooze'){lsSet('nh.snooze',todayKey()); render(); return}
  if(d.range){range=d.range; try{sessionStorage.setItem('nh.range',range)}catch(_){}; render(); return}
  if(d.act==='quick'){openSheet({type:'quick'});return}
  if(d.act==='newFood'){const log=tab==='today'; openSheet({type:'editFood',food:{name:log?search.q.trim():''},then:log?'log':null});return}
  if(d.act==='editThisFood'){openSheet({type:'editFood',food:sheet.food,then:'log',entryId:sheet.entryId});return}
  if(d.editfood){openSheet({type:'editFood',food:foodById(d.editfood)});return}
  if(d.rmfood){const x=foodById(d.rmfood); dropRecord('foods',d.rmfood); toast(`Removed ${x?x.name:'food'}. Logged entries stay.`); render(); return}
  if(d.rmweigh){dropRecord('weighins',d.rmweigh); toast('Weigh-in removed'); render(); return}
  if(d.wunit){state.settings.weightUnit=d.wunit; touchSettings(); render(); return}
  if(d.unitpref){const [k,u]=d.unitpref.split(':'); state.settings.unitPrefs[k]=u; touchSettings(); render(); return}
  if(d.act==='resetAsk'){pendingDelete='ALL';render();return}
  if(d.act==='resetNo'){pendingDelete=null;render();return}
  if(d.act==='resetYes'){
    const ids=LISTS.flatMap(k=>state[k]).map(x=>x.id);
    state={...emptyState(),deleted:state.deleted.concat(ids)}; touchSettings(); pendingDelete=null; toast('Everything erased'); render(); return}
  if(d.act==='driveConnect'||d.act==='driveSync'){driveSync(true);return}
  if(d.act==='driveOff'){driveDisconnect();return}
  if(d.act==='export'){
    const data=JSON.stringify(snapshot(),null,2);
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='nutrition-helper-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
    catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn’t available here')}}
    return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet) closeSheet()});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='dayPick'&&t.value){day=t.value;render();return}
  // Switching units keeps the same amount of food: 100 g becomes 3.53 oz
  if(t.id==='pUnit'&&sheet&&sheet.type==='food'){
    const q=document.getElementById('pQty');
    const amt=baseAmount(sheet.food,num(q.value)||0,t.dataset.prev), one=baseAmount(sheet.food,1,t.value);
    if(amt>0&&one>0) q.value=fmtQty(amt/one);
    t.dataset.prev=t.value;
    document.getElementById('pPreview').innerHTML=previewHtml(sheet.food,q.value,t.value);
    const m=document.getElementById('pMore'); if(m) m.innerHTML=moreHtml(sheet.food,q.value,t.value); return}
  if(t.id==='mfFile'&&t.files[0]){const f=t.files[0]; t.value=''; startImport(f); return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(j.app!=='nutrition-helper') throw 0;
      const n=state.entries.length+state.weighins.length;
      mergeIn(j); saveLocal();
      toast(`Imported ${Math.max(0,state.entries.length+state.weighins.length-n)} new records`); render();
    }catch(_){toast('That file isn’t a Nutrition Helper backup.')}
    t.value='';
  }
});

let renderedToday=todayKey();
function render(){
  renderedToday=todayKey();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const v={today:viewToday,weight:viewWeight,trends:viewTrends,foods:viewFoods,settings:viewSettings}[tab]||viewToday;
  document.getElementById('main').innerHTML=v();
  if(tab==='trends') drawCharts();
}

render();
showDriveStatus();
if(driveConfigured()&&Drive.on){
  loadGis().catch(()=>{});            // ready for the next tap-to-renew
  if(driveLive()) driveSync(false);   // pick up changes made on other devices
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveLive()) driveSync(false)});
}
// The day rolls over while the app stays open on a phone
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||day!==renderedToday||day===todayKey()||sheet) return; day=todayKey(); render()});
</script>
