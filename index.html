<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutrition Helper</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
:root{--accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde4d6; --ok:#11897a; --over:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}}
:root[data-theme="dark"]{--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}
/* Layout: sticky header with tabs over one working column. Today shows the day's budget, the food search, entries and weigh-in.
   Picking a food, scanning, quick add and food editing open in the side sheet (bottom sheet on phones). */
input[type=date],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;font-weight:500;min-width:0}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h2{margin-right:auto}
.nav-btn{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.budget{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.budget{grid-template-columns:repeat(2,minmax(0,1fr))}.budget .m:first-child{grid-column:1/-1}}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m .big{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.m .big small{font-size:13px;color:var(--muted);font-weight:400}
.m .rem{font-size:13px;color:var(--muted)}
.m .rem b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.m.over .rem b{color:var(--over)}
.m.over .meter i{background:var(--over)}
.m.done .rem b{color:var(--ok)}
.m.done .meter i{background:var(--ok)}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
@media (max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .wide{grid-column:1/-1}}
.drawer .form{grid-template-columns:repeat(2,minmax(0,1fr))}
.drawer .form .wide{grid-column:1/-1}
.form input,.form select{width:100%}
.entries{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .nm{font-weight:600;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
button.nm:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ent .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.ent .kc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.x-btn{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x-btn:hover{color:var(--danger);background:var(--sunk)}
.wrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:first-child{border-top:0}
.wrow .d{font-size:13px;color:var(--muted)}
.wrow .v{font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.brand svg .leaf{fill:var(--surface)}
/* food search */
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input{flex:1 1 220px}
.results{display:flex;flex-direction:column;gap:14px}
.rgroup h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;color:var(--ink)}
.rgroup .food:first-of-type{border-top:0}
.food:hover .fn{color:var(--accent)}
.food .fn{font-weight:600;overflow-wrap:anywhere}
.food .fb{font-size:12px;color:var(--muted)}
.food .fk{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.src-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.preview div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.preview b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px}
.preview span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:400px){.preview{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.qty input,.qty select{width:100%;font-size:18px}
.scanbox{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox::after{content:"";position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.note{font-size:13px;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-1px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="13" fill="var(--accent)"/><path class="leaf" d="M16 10c3.5-4 8-3.5 8-3.5s.5 4.5-3.5 8c-2 1.7-4.5 1.5-4.5 1.5S15.6 12 16 10z"/><circle cx="16" cy="19" r="4" fill="var(--surface)"/></svg>
        Nutrition Helper
      </div>
      <span class="save-state" id="saveState">Loading…</span>
      <button class="btn sm" id="driveResume" data-act="driveSync" hidden>Resume Drive sync</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="weight" aria-selected="false">Weight</button>
      <button role="tab" data-tab="foods" aria-selected="false">Foods</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- Metrics ---------------- */
// Budgets: calories, fat and carbs are targets; protein is a floor to reach; sodium is a ceiling to stay under.
const METRICS=[
  {k:'kcal',n:'Calories',s:'kcal',u:'kcal',kind:'target'},
  {k:'protein',n:'Protein',s:'Protein',u:'g',kind:'floor'},
  {k:'fat',n:'Fat',s:'Fat',u:'g',kind:'target'},
  {k:'carbs',n:'Carbs',s:'Carbs',u:'g',kind:'target'},
  {k:'sodium',n:'Sodium',s:'Sodium',u:'mg',kind:'ceiling'}];
const DEFAULT_TARGETS={kcal:2200,protein:160,fat:70,carbs:230,sodium:2300};
const KG_PER_LB=0.45359237;

/* ---------------- Units ---------------- */
// Foods keep nutrition per 100 g (or per 100 ml for drinks). Amounts convert through grams or millilitres;
// crossing between weight and volume needs the food's density, so those units only show when it's known.
const UNITS={
  g:{kind:'mass',f:1,n:'g'}, oz:{kind:'mass',f:28.349523125,n:'oz'}, lb:{kind:'mass',f:453.59237,n:'lb'}, kg:{kind:'mass',f:1000,n:'kg'},
  ml:{kind:'volume',f:1,n:'ml'}, tsp:{kind:'volume',f:4.92892,n:'tsp'}, tbsp:{kind:'volume',f:14.7868,n:'tbsp'},
  floz:{kind:'volume',f:29.5735,n:'fl oz'}, cup:{kind:'volume',f:236.588,n:'cup'}, l:{kind:'volume',f:1000,n:'l'}};
const KIND_OF_BASE={g:'mass',ml:'volume'};
const unitKind=u=>u&&u.startsWith('srv:')?'serving':(UNITS[u]||{}).kind;

/* ---------------- State & storage ---------------- */
/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID='326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const LS_KEY='nutritionHelper.v1';
const uid6=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const nowIso=()=>new Date().toISOString();
// Settings change as a whole (newest wins on merge); entries, weigh-ins and foods are records merged by id.
function defaultSettings(){return{
  weightUnit:'lb',
  unitPrefs:{mass:'g',volume:'ml'},   // last weight and volume unit used when logging, reused for every food
  usdaKey:'',
  targets:[{from:'2000-01-01',...DEFAULT_TARGETS}],
  updatedAt:''
};}
function emptyState(){return{settings:defaultSettings(),entries:[],weighins:[],foods:[],deleted:[]}}
let state=emptyState();

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function normalize(j){
  const s=emptyState();
  if(!j||typeof j!=='object') return s;
  s.settings=Object.assign(defaultSettings(),j.settings||{});
  s.settings.unitPrefs=Object.assign(defaultSettings().unitPrefs,s.settings.unitPrefs||{});
  if(!Array.isArray(s.settings.targets)||!s.settings.targets.length) s.settings.targets=defaultSettings().targets;
  for(const k of ['entries','weighins','foods','deleted']) if(Array.isArray(j[k])) s[k]=j[k].filter(Boolean);
  return s;
}
const local=lsGet(LS_KEY); if(local) state=normalize(local);
function saveLocal(){if(!lsSet(LS_KEY,state)) toast('This browser is out of space. Export a backup.'); driveSoon()}
function touchSettings(){state.settings.updatedAt=nowIso(); saveLocal()}
function putRecord(list,rec){rec.u=nowIso(); const a=state[list], i=a.findIndex(x=>x.id===rec.id); i>=0?a[i]=rec:a.push(rec); saveLocal()}
function dropRecord(list,id){state[list]=state[list].filter(x=>x.id!==id); state.deleted.push(id); saveLocal()}
function setSaveState(t){document.getElementById('saveState').textContent=t}

/* ---------------- Dates & formatting ---------------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay=k=>{const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d)};
const todayKey=()=>dkey(new Date());
const addDays=(k,n)=>{const d=parseDay(k); d.setDate(d.getDate()+n); return dkey(d)};
function dayLabel(k){
  const t=todayKey();
  if(k===t) return 'Today'; if(k===addDays(t,-1)) return 'Yesterday'; if(k===addDays(t,1)) return 'Tomorrow';
  return parseDay(k).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:k.slice(0,4)===t.slice(0,4)?undefined:'numeric'});
}
const wUnit=()=>state.settings.weightUnit;
const toDisp=kg=>wUnit()==='lb'?kg/KG_PER_LB:kg;
const fromDisp=v=>wUnit()==='lb'?v*KG_PER_LB:v;
const fmtW=kg=>kg==null?'–':toDisp(kg).toFixed(1);
const fmt=(v,dp=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString([], {maximumFractionDigits:dp,minimumFractionDigits:dp});
const fmtQty=q=>String(+(+q).toFixed(q>=100?0:q>=10?1:2));

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// A food: {id, name, brand, barcode, source:'custom'|'off'|'usda', ext, base:'g'|'ml', per100:{kcal,protein,fat,carbs,sodium},
//          density (g per ml, optional), servings:[{n:'1 bar', amt: in base units}], lastUnit, lastQty, lastAmt, uses, lastUsed}
const foodById=id=>state.foods.find(f=>f.id===id);
const foodByExt=ext=>ext&&state.foods.find(f=>f.ext===ext);
const foodByBarcode=code=>code&&state.foods.find(f=>f.barcode===code);
function unitLabel(f,u){if(unitKind(u)==='serving'){const s=f.servings[+u.slice(4)]; return s?s.n:'serving'} return (UNITS[u]||{}).n||u}
function unitOptions(f){
  const out=(f.servings||[]).map((s,i)=>'srv:'+i);
  const prefs=state.settings.unitPrefs, baseKind=KIND_OF_BASE[f.base];
  for(const kind of ['mass','volume']){
    if(kind!==baseKind&&!f.density) continue;
    const list=Object.keys(UNITS).filter(u=>UNITS[u].kind===kind);
    out.push(prefs[kind],...list.filter(u=>u!==prefs[kind]));
  }
  return out;
}
// Amount in the food's base unit (g or ml)
function baseAmount(f,qty,unit){
  if(unitKind(unit)==='serving'){const s=f.servings[+unit.slice(4)]; return s?qty*s.amt:0}
  const U=UNITS[unit]; if(!U) return 0;
  const v=qty*U.f, baseKind=KIND_OF_BASE[f.base];
  if(U.kind===baseKind) return v;
  return U.kind==='mass'?v/(f.density||1):v*(f.density||1);
}
function nutrientsFor(f,amt){const o={}; METRICS.forEach(m=>o[m.k]=(Number(f.per100[m.k])||0)*amt/100); return o}
// Sticky units: open a food in the unit it was last logged in, but switch weight or volume units to the ones last used anywhere
function defaultPortion(f){
  const opts=unitOptions(f), prefs=state.settings.unitPrefs;
  let unit=f.lastUnit, qty=f.lastQty;
  if(unit&&unitKind(unit)!=='serving'&&UNITS[unit]){
    const pref=prefs[UNITS[unit].kind];
    if(pref&&pref!==unit&&opts.includes(pref)){qty=(f.lastAmt!=null?f.lastAmt:baseAmount(f,qty,unit))/baseAmount(f,1,pref); unit=pref}
  }
  if(!unit||!opts.includes(unit)){unit=opts[0]; qty=unitKind(unit)==='serving'?1:(UNITS[unit].kind==='mass'?(unit==='g'?100:unit==='oz'?4:1):(unit==='ml'?250:1))}
  return {unit,qty:+fmtQty(qty||1)};
}
const per100Summary=f=>`${fmt(f.per100.kcal)} kcal · P ${fmt(f.per100.protein,1)} · F ${fmt(f.per100.fat,1)} · C ${fmt(f.per100.carbs,1)} per 100 ${f.base}`;
function servingSummary(f){
  const s=f.servings&&f.servings[0]; if(!s) return per100Summary(f);
  const n=nutrientsFor(f,s.amt); return `${esc(s.n)}: ${fmt(n.kcal)} kcal · P ${fmt(n.protein,1)} · F ${fmt(n.fat,1)} · C ${fmt(n.carbs,1)}`;
}

// Open Food Facts (barcodes and branded foods) and USDA FoodData Central (generic foods). Both allow browser requests.
const OFF='https://world.openfoodfacts.org', FDC='https://api.nal.usda.gov/fdc/v1';
const OFF_FIELDS='code,product_name,generic_name,brands,nutriments,serving_size,serving_quantity,serving_quantity_unit,quantity,product_quantity,product_quantity_unit';
function timedFetch(url,ms=12000){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
function fromOFF(p){
  if(!p) return null;
  const n=p.nutriments||{}, name=(p.product_name||p.generic_name||'').trim(); if(!name) return null;
  const sq=num(p.serving_quantity), liquid=/^(ml|cl|l)$/i.test(p.serving_quantity_unit||p.product_quantity_unit||'');
  const pick=k=>{const v=num(n[k+'_100g']); if(v!=null) return v; const s=num(n[k+'_serving']); return s!=null&&sq?s*100/sq:null};
  let kcal=pick('energy-kcal'); if(kcal==null){const kj=pick('energy'); if(kj!=null) kcal=kj/4.184}
  if(kcal==null) return null;
  const sodiumG=pick('sodium'), saltG=pick('salt');
  const servings=[]; if(sq>0) servings.push({n:(p.serving_size||'1 serving').trim(),amt:sq});
  const pq=num(p.product_quantity); if(pq>0&&pq!==sq) servings.push({n:'Whole package'+(p.quantity?` (${p.quantity})`:''),amt:pq});
  return {name,brand:(p.brands||'').split(',')[0].trim(),barcode:p.code||'',source:'off',ext:'off:'+p.code,base:liquid?'ml':'g',
    per100:{kcal,protein:pick('proteins')||0,fat:pick('fat')||0,carbs:pick('carbohydrates')||0,sodium:sodiumG!=null?sodiumG*1000:saltG!=null?saltG*400:0},
    servings};
}
async function offSearch(q){
  const r=await timedFetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${OFF_FIELDS}`);
  if(!r.ok) throw new Error('off'); const j=await r.json();
  return (j.products||[]).map(fromOFF).filter(Boolean);
}
async function offBarcode(code){
  const r=await timedFetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}?fields=${OFF_FIELDS}`);
  if(r.status===404) return null; if(!r.ok) throw new Error('off');
  const j=await r.json(); return j.status===1||j.product?fromOFF({...j.product,code:j.product&&j.product.code||code}):null;
}
const FDC_IDS={kcal:[1008,2047,2048],protein:[1003],fat:[1004],carbs:[1005],sodium:[1093]};
function fromFDC(x){
  const byId={}; (x.foodNutrients||[]).forEach(n=>{byId[n.nutrientId]=n.value});
  const get=k=>{for(const id of FDC_IDS[k]) if(byId[id]!=null) return byId[id]; return null};
  if(get('kcal')==null) return null;
  const per100={}; for(const k in FDC_IDS) per100[k]=get(k)||0;
  const servings=(x.foodMeasures||[]).filter(m=>m.gramWeight>0&&m.disseminationText&&!/not specified/i.test(m.disseminationText))
    .slice(0,8).map(m=>({n:m.disseminationText,amt:m.gramWeight}));
  return {name:x.description,brand:'',barcode:'',source:'usda',ext:'usda:'+x.fdcId,base:'g',per100,servings};
}
async function fdcSearch(q){
  const key=state.settings.usdaKey||'DEMO_KEY';
  const r=await timedFetch(`${FDC}/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(q)}&pageSize=20&dataType=${encodeURIComponent('Foundation,SR Legacy,Survey (FNDDS)')}`);
  if(!r.ok) throw new Error(r.status===429?'limit':'fdc'); const j=await r.json();
  return (j.foods||[]).map(fromFDC).filter(Boolean);
}

// Uses the drive.file scope, so the app can only see the one file it creates.
const DRIVE_FILE='Nutrition Helper data.json', DAPI='https://www.googleapis.com';
const Drive={token:null,exp:0,fileId:lsGet('nh.driveFile'),on:!!lsGet('nh.driveOn'),busy:false,last:null,timer:null,err:null,lastAsk:0};
// Keep the short-lived Google token across reloads so reopening the app doesn't pause sync
(()=>{const t=lsGet('nh.driveTok'); if(Drive.on&&t&&t.exp>Date.now()){Drive.token=t.token;Drive.exp=t.exp}})();
const driveConfigured=()=>!!GOOGLE_CLIENT_ID;
const driveLive=()=>!!Drive.token&&Date.now()<Drive.exp;
function loadGis(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.onload=res; sc.onerror=()=>rej(new Error('gis')); document.head.appendChild(sc)})}
function driveToken(){return new Promise(async(res,rej)=>{
  try{await loadGis()}catch(e){return rej(e)}
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error) return rej(r); Drive.token=r.access_token; Drive.exp=Date.now()+(Number(r.expires_in||3600)-60)*1000; lsSet('nh.driveTok',{token:Drive.token,exp:Drive.exp}); res()},
    error_callback:rej});
  c.requestAccessToken({prompt:Drive.on?'':'consent'});
})}
async function dfetch(path,opt={}){
  if(!driveLive()) throw {code:'expired'};
  const r=await fetch(DAPI+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+Drive.token}});
  if(r.status===401){Drive.token=null; lsSet('nh.driveTok',null); throw {code:'expired'}}
  if(!r.ok) throw {code:'http',status:r.status};
  return r;
}
async function driveFind(){
  if(Drive.fileId){
    try{const j=await (await dfetch(`/drive/v3/files/${Drive.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return Drive.fileId}
    catch(e){if(e.code==='expired') throw e}
  }
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j=await (await dfetch(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
  Drive.fileId=j.files&&j.files[0]?j.files[0].id:null; lsSet('nh.driveFile',Drive.fileId);
  return Drive.fileId;
}
const snapshot=()=>({app:'nutrition-helper',v:1,saved:nowIso(),...state});
async function driveRead(){const id=await driveFind(); return id?(await dfetch(`/drive/v3/files/${id}?alt=media`)).json():null}
async function driveWrite(){
  const body=JSON.stringify(snapshot());
  const id=await driveFind();
  if(id){await dfetch(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
  const b='nh'+uid6(), meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
  const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j=await (await dfetch('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi})).json();
  Drive.fileId=j.id; lsSet('nh.driveFile',j.id);
}
// Combine another copy (Drive or a backup) with this browser: records from both minus deletions, the newer edit of each record, the newer settings
function mergeIn(r){
  if(!r||r.app!=='nutrition-helper') return false;
  const o=normalize(r), before=JSON.stringify(state);
  const del=new Set([...state.deleted,...o.deleted]);
  for(const k of ['entries','weighins','foods']){
    const byId=new Map();
    [...o[k],...state[k]].forEach(x=>{if(!x.id||del.has(x.id)) return; const h=byId.get(x.id); if(!h||(x.u||'')>=(h.u||'')) byId.set(x.id,x)});
    state[k]=[...byId.values()];
  }
  state.deleted=[...del];
  if((o.settings.updatedAt||'')>(state.settings.updatedAt||'')) state.settings=o.settings;
  lsSet(LS_KEY,state);
  return JSON.stringify(state)!==before;
}
function driveStatus(){
  if(!driveConfigured()||!Drive.on) return null;
  if(Drive.busy) return 'Syncing with Google Drive…';
  if(Drive.err) return Drive.err;
  if(!driveLive()) return 'Google Drive paused';
  return 'Synced to Google Drive'+(Drive.last?' · '+Drive.last.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'');
}
function showDriveStatus(){const t=driveStatus(); setSaveState(t||'Saved in this browser'); const b=document.getElementById('driveResume'); if(b) b.hidden=!(driveConfigured()&&Drive.on&&!driveLive()&&!Drive.busy)}
async function driveSync(interactive){
  if(Drive.busy) return;
  try{
    if(!driveLive()){ if(!interactive){showDriveStatus();return} await driveToken() }
    Drive.busy=true; Drive.err=null; showDriveStatus();
    const changed=mergeIn(await driveRead());
    await driveWrite();
    Drive.on=true; lsSet('nh.driveOn',true); Drive.last=new Date();
    if(changed&&!sheet) render();
  }catch(e){
    if(e&&e.code!=='expired') Drive.err=(e.type==='popup_closed'||e.error==='access_denied')?null:'Couldn’t reach Google Drive';
    if(interactive&&Drive.err) toast('Couldn’t connect to Google Drive. Everything is still saved in this browser.');
  }finally{Drive.busy=false; showDriveStatus(); if(tab==='settings'&&!sheet) render()}
}
function driveSoon(){
  if(!driveConfigured()||!Drive.on) return;
  clearTimeout(Drive.timer);
  Drive.timer=setTimeout(async()=>{
    if(!driveLive()){showDriveStatus();return}
    try{Drive.busy=true;showDriveStatus();await driveWrite();Drive.last=new Date();Drive.err=null}
    catch(e){if(e.code!=='expired')Drive.err='Couldn’t reach Google Drive'}
    finally{Drive.busy=false;showDriveStatus()}
  },3000);
}
function driveDisconnect(){
  if(Drive.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(Drive.token,()=>{});
  Drive.token=null; Drive.on=false; Drive.err=null; lsSet('nh.driveOn',false); lsSet('nh.driveTok',null); showDriveStatus(); render();
}
function drivePanel(){
  if(!driveConfigured()) return `<p class="small muted">Google Drive sync isn’t set up for this copy of the app yet.</p>`;
  if(!Drive.on) return `<p class="small">Keep your food log, weigh-ins, foods and targets in your own Google Drive and pick them up on any device. The app can only see the one file it creates there.</p>

    <button class="btn sm ghost" data-act="driveOff">Disconnect</button></div>`;
}

function budgetCard(m,eaten,target){
  const left=target-eaten, pct=target>0?Math.min(100,eaten/target*100):0;
  let cls='', rem;
  if(m.kind==='floor'){
    if(left<=0){cls='done'; rem=`<b>Reached</b>${left<0?` · ${fmt(-left)} ${m.u} over`:''}`}
    else rem=`<b>${fmt(left)}</b> ${m.u} to go`;
  }else if(left<0){cls='over'; rem=`<b>${fmt(-left)}</b> ${m.u} over`}
  else rem=`<b>${fmt(left)}</b> ${m.u} left`;
  return `<div class="m ${cls}"><span class="lbl">${m.n}${m.kind==='ceiling'?' (max)':m.kind==='floor'?' (min)':''}</span>
    <span class="big">${fmt(eaten)}<small> / ${fmt(target)} ${m.u}</small></span>
    <div class="meter" role="img" aria-label="${m.n}: ${fmt(eaten)} of ${fmt(target)} ${m.u}"><i style="width:${pct}%"></i></div>
    <span class="rem">${rem}</span></div>`;
}
function entryMeta(e){

  return `${amt}P ${fmt(e.protein)} · F ${fmt(e.fat)} · C ${fmt(e.carbs)} · Na ${fmt(e.sodium)} mg`;
}

function localMatches(q){

function runSearch(){
  const q=search.q.trim(), seq=++search.seq;
  search.off=search.usda=null; search.err={};
  if(q.length<2){search.busy={off:false,usda:false}; refreshResults(); return}
  search.busy={off:true,usda:true}; refreshResults();
  const go=(key,fn)=>fn(q).then(r=>{if(seq===search.seq) search[key]=r})
    .catch(e=>{if(seq===search.seq) search.err[key]=e.message==='limit'?'USDA search limit reached for now. Add your own free USDA key in Settings.':`Couldn’t reach ${key==='off'?'Open Food Facts':'USDA'}.`})
    .finally(()=>{if(seq===search.seq){search.busy[key]=false; refreshResults()}});
  go('off',offSearch); go('usda',fdcSearch);
}

function viewWeight(){
  const ws=weighinsSorted(), last=ws[0];

/* ---------------- Barcode scanning ---------------- */
// Native BarcodeDetector where the browser has it (Chrome on Android); ZXing from a CDN elsewhere (iPhone Safari).
const scan={stream:null,timer:null,zx:null,busy:false};
function loadZxing(){return new Promise((res,rej)=>{
  if(window.ZXingBrowser) return res(window.ZXingBrowser);
  const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
  sc.onload=()=>window.ZXingBrowser?res(window.ZXingBrowser):rej(new Error('zxing')); sc.onerror=()=>rej(new Error('zxing')); document.head.appendChild(sc)})}
async function startScan(){
  const v=document.getElementById('scanVideo'), note=document.getElementById('scanNote');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){note.textContent='This browser can’t use the camera. Type the barcode number instead.';return}
  try{
    if('BarcodeDetector' in window){
      const fmts=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      const want=['ean_13','ean_8','upc_a','upc_e'].filter(f=>fmts.includes(f));
      if(want.length){
        const det=new BarcodeDetector({formats:want});
        scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        if(!sheet||sheet.type!=='scan'){stopScan();return}
        v.srcObject=scan.stream; await v.play();
        scan.timer=setInterval(async()=>{if(scan.busy||v.readyState<2) return; try{const r=await det.detect(v); if(r[0]) gotBarcode(r[0].rawValue)}catch(_){}},250);
        return;
      }
    }
    const Z=await loadZxing(); if(!sheet||sheet.type!=='scan') return;
    const reader=new Z.BrowserMultiFormatReader();
    scan.zx=await reader.decodeFromConstraints({video:{facingMode:'environment'}},v,r=>{if(r&&!scan.busy) gotBarcode(r.getText())});
    if(!sheet||sheet.type!=='scan') stopScan();
  }catch(e){
    if(note) note.textContent=e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in the browser, or type the barcode number.':'Couldn’t start the camera. Type the barcode number instead.';
  }
}
function stopScan(){
  clearInterval(scan.timer); scan.timer=null; scan.busy=false;
  if(scan.zx){try{scan.zx.stop()}catch(_){} scan.zx=null}
  if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null}
}
async function gotBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(!code) return;
  scan.busy=true; if(navigator.vibrate) navigator.vibrate(40);
  const note=document.getElementById('scanNote'); if(note) note.innerHTML=`<span class="spin"></span>Looking up ${esc(code)}…`;
  const mine=foodByBarcode(code);
  if(mine){openSheet({type:'food',food:mine});return}
  try{
    const f=await offBarcode(code);
    if(!sheet||sheet.type!=='scan') return;
    if(f){openSheet({type:'food',food:foodByExt(f.ext)||f});return}
    toast('Not in Open Food Facts. Add it from the label.');
    openSheet({type:'editFood',food:{barcode:code},then:'log'});
  }catch(_){
    scan.busy=false; if(note) note.textContent=`Couldn’t reach Open Food Facts to look up ${code}. Check your connection and try again.`;
  }
}

// Online results become library foods the first time they're logged
function keepFood(f){
  if(f.id) return f;
  const have=foodByExt(f.ext); if(have) return have;
  const rec={...f,id:'f'+uid6(),uses:0}; putRecord('foods',rec); return rec;
}
function logPortion(f,qty,unit,entryId){
  f=keepFood(f);
  const amt=baseAmount(f,qty,unit), n=nutrientsFor(f,amt), old=entryId&&state.entries.find(x=>x.id===entryId);
  const rec={id:old?old.id:'e'+uid6(),date:old?old.date:day,ts:old?old.ts:nowIso(),foodId:f.id,name:f.name+(f.brand?` (${f.brand})`:''),
    qty,unit,unitLabel:unitLabel(f,unit),amt,...n};
  putRecord('entries',rec);
  Object.assign(f,{lastUnit:unit,lastQty:qty,lastAmt:amt,lastUsed:nowIso(),uses:(f.uses||0)+(old?0:1)}); putRecord('foods',f);
  const k=unitKind(unit); if(k!=='serving'&&state.settings.unitPrefs[k]!==unit){state.settings.unitPrefs[k]=unit; touchSettings()}
  return rec;
}

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='dayPick'&&t.value){day=t.value;render();return}
  // Switching units keeps the same amount of food: 100 g becomes 3.53 oz
  if(t.id==='pUnit'&&sheet&&sheet.type==='food'){
    const q=document.getElementById('pQty');
    const amt=baseAmount(sheet.food,num(q.value)||0,t.dataset.prev), one=baseAmount(sheet.food,1,t.value);
    if(amt>0&&one>0) q.value=fmtQty(amt/one);
    t.dataset.prev=t.value;
    document.getElementById('pPreview').innerHTML=previewHtml(sheet.food,q.value,t.value); return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(j.app!=='nutrition-helper') throw 0;
      const n=state.entries.length+state.weighins.length;
      mergeIn(j); saveLocal();
      toast(`Imported ${Math.max(0,state.entries.length+state.weighins.length-n)} new records`); render();
    }catch(_){toast('That file isn’t a Nutrition Helper backup.')}
    t.value='';
  }
});

let renderedToday=todayKey();
function render(){
  renderedToday=todayKey();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const v={today:viewToday,weight:viewWeight,foods:viewFoods,settings:viewSettings}[tab]||viewToday;
  document.getElementById('main').innerHTML=v();
}

render();
showDriveStatus();
if(driveConfigured()&&Drive.on){
  loadGis().catch(()=>{});            // ready for the next tap-to-renew
  if(driveLive()) driveSync(false);   // pick up changes made on other devices
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveLive()) driveSync(false)});
}
// The day rolls over while the app stays open on a phone
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||day!==renderedToday||day===todayKey()||sheet) return; day=todayKey(); render()});
</script>
