<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutrition Helper</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
:root{--accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde4d6; --ok:#11897a; --over:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}}
:root[data-theme="dark"]{--accent:#fb8a4c; --accent-ink:#1f0c03; --accent-soft:#3d2014; --ok:#3cc3ad; --over:#ff8a80}
/* Layout: sticky header with tabs over one working column. Today shows the day's budget, entries and weigh-in.
   Adding food is its own overlay (full screen on phones, a centred window on wide screens), opened from the Add food button.
   Picking a food, scanning, quick add and food editing open in the side sheet (bottom sheet on phones) above it. */
.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding:13px 20px;font-size:16px;box-shadow:0 6px 18px rgba(10,16,20,.22)}
.has-fab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.has-fab ~ #toastHost .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
body.adding{overflow:hidden}
.adder{position:fixed;z-index:32;left:50%;top:5vh;transform:translateX(-50%);width:min(640px,calc(100% - 32px));height:90vh;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.adder-scrim{z-index:31}
.adder .ahead{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.adder .atitle{display:flex;align-items:center;gap:10px}
.adder .atitle h2{margin:0;margin-right:auto}
.adder .x{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;font-size:20px;line-height:1;flex:none}
.adder .left{font-size:13px;color:var(--muted)}
.adder .left b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.adder .left .over{color:var(--over)}
.adder .abody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){
  .adder{inset:0;transform:none;width:auto;height:auto;border:0;border-radius:0}
  .adder .ahead{padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .adder-scrim{display:none}
}
@media (prefers-reduced-motion:no-preference){.adder{animation:rise .16s ease-out}@keyframes rise{from{opacity:.3;margin-top:16px}}}
input[type=date],input[type=time],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;font-weight:500;min-width:0}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h2{margin-right:auto}
.nav-btn{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.budget{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.budget{grid-template-columns:repeat(3,minmax(0,1fr))}.budget .m:first-child{grid-column:1/-1}}
@media (max-width:560px){.budget{gap:8px}.budget .m:not(:first-child){padding:10px 11px}.budget .m:not(:first-child) .lbl{font-size:11px;letter-spacing:.03em}
  .budget .m:not(:first-child) .big{font-size:19px}.budget .m:not(:first-child) .big small{display:block;font-size:12px}.budget .m:not(:first-child) .rem{font-size:12px}}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m .big{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.m .big small{font-size:13px;color:var(--muted);font-weight:400}
.m .rem{font-size:13px;color:var(--muted)}
.m .rem b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.m.over .rem b{color:var(--over)}
.m.over .meter i{background:var(--over)}
.m.done .rem b{color:var(--ok)}
.m.done .meter i{background:var(--ok)}
.micros{gap:0}
.micros h3{margin-bottom:6px}
.mic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.mic .meter,.mic .rem{grid-column:1/-1}
.mic .nm{font-weight:600}
.mic .nm small,.mic .v small,.mic .rem{font-size:13px;color:var(--muted);font-weight:400}
.mic .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mic .rem b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.mic.over .rem b{color:var(--over)}
.mic.over .meter i{background:var(--over)}
.mic.done .rem b{color:var(--ok)}
.mic.done .meter i{background:var(--ok)}
.micset{display:grid;grid-template-columns:minmax(0,1fr) auto 84px 56px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.micset input{width:100%;padding-left:8px;padding-right:6px}
.micset select{padding-left:8px;padding-right:4px;font-size:14px}
.micset .src{display:block;font-size:12px;color:var(--muted)}
.micset .src.own{color:var(--accent)}
.micset .x-btn{padding:4px}
.tgh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:14px 0 2px}
@media (max-width:400px){.micset{grid-template-columns:minmax(0,1fr) auto 70px 52px;gap:6px}}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
@media (max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .wide{grid-column:1/-1}}
.drawer .form{grid-template-columns:repeat(2,minmax(0,1fr))}
.drawer .form .wide{grid-column:1/-1}
.form input,.form select{width:100%}
.entries{display:flex;flex-direction:column}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .nm{font-weight:600;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
button.nm:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ent .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.ent .kc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.x-btn{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x-btn:hover{color:var(--danger);background:var(--sunk)}
.wrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:first-child{border-top:0}
.wrow .d{font-size:13px;color:var(--muted)}
.wrow .v{font-family:var(--f-mono)}
.spark{vertical-align:middle;margin-right:4px;overflow:visible}
.spark polyline{fill:none;stroke:var(--c-a);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--c-a)} .spark .base{stroke:var(--line);stroke-width:1}
.tod{display:flex;gap:3px;align-items:flex-end}
.tod span{display:flex;flex-direction:column;align-items:center;gap:2px;width:15px}
.tod i{display:block;width:11px;border-radius:2px 2px 0 0;background:var(--c-a);min-height:1px}
.tod i.z{background:var(--line)}
.tod b{font:500 9px/1 var(--f-mono);color:var(--faint)}
.tod b.on{color:var(--ink);font-weight:700}
.rlist .ent{grid-template-columns:minmax(0,1fr) auto auto auto}
.dpset{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.dpset:first-child{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.brand svg .leaf{fill:var(--surface)}
/* food search */
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input{flex:1 1 220px}
.results{display:flex;flex-direction:column;gap:14px}
.rgroup h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;color:var(--ink)}
.rgroup .food:first-of-type{border-top:0}
.food:hover .fn{color:var(--accent)}
.food .fn{font-weight:600;overflow-wrap:anywhere}
.food .fb{font-size:12px;color:var(--muted)}
.food .fk{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
/* suggestions carry a one-tap add for the usual portion; recipe logs group their foods */
.sug{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-top:1px solid var(--line)}
.rgroup .sug:first-of-type{border-top:0}
.sug .food{border-top:0}
.add-btn{white-space:nowrap}
.rgrp .ent.sub{padding-left:14px;border-top-style:dashed}
/* the day's report, by part of the day or by a nutrient */
.ent .kc small{display:block;text-align:right;font-size:11px;color:var(--faint)}
.ent .kc.by{font-weight:600;text-align:right}
.ent .kc.by small{font-weight:400}
.ehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ehead:first-child{margin-top:0}
.ehead span{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-weight:500}
.ehead+.ent,.ehead+.rgrp .ent:first-child{border-top:0}
.sortpick{max-width:150px;padding:4px 8px;font-size:13px}
/* moving an entry to another day or time */
.move{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.move h3{margin:0 0 4px}
.move .row input{flex:1 1 130px;min-width:0}
.picks{display:flex;flex-direction:column;gap:2px}
.mform label.field .was{font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-family:var(--f-mono);min-height:1.3em}
.mform label.field .was b{font-weight:600;color:var(--accent)}
.mtbl td,.mtbl th{text-align:right}.mtbl td:first-child,.mtbl th:first-child{text-align:left}
.bodymap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,200px) minmax(0,1fr);gap:0 14px;align-items:start}
.bm-col{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}

<script>
/* ---------------- Metrics ---------------- */
// Budgets: calories, fat and carbs are targets; protein is a floor to reach; sodium is a ceiling to stay under.
const METRICS=[
  {k:'kcal',n:'Calories',s:'kcal',u:'kcal',kind:'target'},
  {k:'protein',n:'Protein',s:'Protein',u:'g',kind:'floor'},
  {k:'fat',n:'Fat',s:'Fat',u:'g',kind:'target'},
  {k:'carbs',n:'Carbs',s:'Carbs',u:'g',kind:'target'},
  {k:'sodium',n:'Sodium',s:'Sodium',u:'mg',kind:'ceiling'}];
const DEFAULT_TARGETS={kcal:2200,protein:160,fat:70,carbs:230,sodium:2300};
const KG_PER_LB=0.45359237;

/* ---------------- Nutrients ---------------- */
// Foods keep every nutrient their source reports, per 100 g or ml. The five metrics above drive the budget;
// the rest are kept for detail views and reports. Nutrients in this catalog are stored under its keys and
// snapshotted on each logged entry (entry.more). Anything else a source reports is kept on the food under
// 'fdc:<id>', 'off:<name>' or 'mf:<name>' with its name and unit in food.nmeta, and can be worked out for an
// entry from its foodId and amt.
const NUTRIENTS=[
  ['kcal','Calories','kcal','Energy',[1008,2047,2048]],
  ['protein','Protein','g','Macros',[1003],'proteins'],
  ['fat','Fat','g','Macros',[1004],'fat'],
  ['carbs','Carbs','g','Macros',[1005],'carbohydrates'],
  ['fiber','Fiber','g','Carbs',[1079],'fiber'],
  ['sugars','Sugars','g','Carbs',[2000,1063],'sugars'],
  ['addedSugars','Added sugars','g','Carbs',[1235],'added-sugars'],
  ['starch','Starch','g','Carbs',[1009],'starch'],
  ['satFat','Saturated fat','g','Fats',[1258],'saturated-fat'],
  ['monoFat','Monounsaturated fat','g','Fats',[1292],'monounsaturated-fat'],
  ['polyFat','Polyunsaturated fat','g','Fats',[1293],'polyunsaturated-fat'],
  ['transFat','Trans fat','g','Fats',[1257],'trans-fat'],
  ['omega3','Omega-3','g','Fats',[],'omega-3-fat'],
  ['ala','Omega-3 ALA','g','Fats',[1404],'alpha-linolenic-acid'],
  ['epa','Omega-3 EPA','g','Fats',[1278],'eicosapentaenoic-acid'],
  ['dha','Omega-3 DHA','g','Fats',[1272],'docosahexaenoic-acid'],
  ['omega6','Omega-6','g','Fats',[],'omega-6-fat'],
  ['cholesterol','Cholesterol','mg','Fats',[1253],'cholesterol'],
  ['sodium','Sodium','mg','Minerals',[1093],'sodium'],
  ['potassium','Potassium','mg','Minerals',[1092],'potassium'],
  ['calcium','Calcium','mg','Minerals',[1087],'calcium'],
  ['iron','Iron','mg','Minerals',[1089],'iron'],
  ['magnesium','Magnesium','mg','Minerals',[1090],'magnesium'],
  ['phosphorus','Phosphorus','mg','Minerals',[1091],'phosphorus'],
  ['zinc','Zinc','mg','Minerals',[1095],'zinc'],
  ['copper','Copper','mg','Minerals',[1098],'copper'],
  ['manganese','Manganese','mg','Minerals',[1101],'manganese'],
  ['selenium','Selenium','µg','Minerals',[1103],'selenium'],
  ['iodine','Iodine','µg','Minerals',[1100],'iodine'],
  ['chloride','Chloride','mg','Minerals',[1088],'chloride'],
  ['chromium','Chromium','µg','Minerals',[1096],'chromium'],
  ['molybdenum','Molybdenum','µg','Minerals',[1102],'molybdenum'],
  ['fluoride','Fluoride','µg','Minerals',[1099],'fluoride'],
  ['vitA','Vitamin A','µg','Vitamins',[1106],'vitamin-a'],
  ['vitC','Vitamin C','mg','Vitamins',[1162],'vitamin-c'],
  ['vitD','Vitamin D','µg','Vitamins',[1114],'vitamin-d'],
  ['vitE','Vitamin E','mg','Vitamins',[1109],'vitamin-e'],
  ['vitK','Vitamin K','µg','Vitamins',[1185],'vitamin-k'],
  ['thiamin','Thiamin (B1)','mg','Vitamins',[1165],'vitamin-b1'],
  ['riboflavin','Riboflavin (B2)','mg','Vitamins',[1166],'vitamin-b2'],
  ['niacin','Niacin (B3)','mg','Vitamins',[1167],'vitamin-pp'],
  ['pantothenic','Pantothenic acid (B5)','mg','Vitamins',[1170],'pantothenic-acid'],
  ['vitB6','Vitamin B6','mg','Vitamins',[1175],'vitamin-b6'],
  ['biotin','Biotin (B7)','µg','Vitamins',[1176],'biotin'],
  ['folate','Folate (B9)','µg','Vitamins',[1190,1177],'vitamin-b9'],
  ['vitB12','Vitamin B12','µg','Vitamins',[1178],'vitamin-b12'],
  ['choline','Choline','mg','Vitamins',[1180],'choline'],
  ['water','Water','g','Other',[1051],'water'],
  ['alcohol','Alcohol','g','Other',[1018]],
  ['caffeine','Caffeine','mg','Other',[1057],'caffeine'],
].map(([k,n,u,g,fdc,off])=>({k,n,u,g,fdc,off}));
const NUT=Object.fromEntries(NUTRIENTS.map(x=>[x.k,x]));
const NUT_BY_FDC={}; NUTRIENTS.forEach(x=>x.fdc.forEach((id,i)=>{if(!(id in NUT_BY_FDC)) NUT_BY_FDC[id]={k:x.k,rank:i}}));
const NUT_BY_OFF=Object.fromEntries(NUTRIENTS.filter(x=>x.off).map(x=>[x.off,x.k]));
const MASS_IN_G={g:1,mg:1e-3,'µg':1e-6,ug:1e-6,mcg:1e-6};
const normUnit=u=>{u=String(u||'').trim().toLowerCase(); return u==='ug'||u==='mcg'||u==='μg'?'µg':u};
// Convert between g, mg and µg; any other unit only passes through unchanged
function convertMass(v,from,to){from=normUnit(from); to=normUnit(to); if(from===to) return v; return from in MASS_IN_G&&to in MASS_IN_G?v*MASS_IN_G[from]/MASS_IN_G[to]:null}
const nutName=(k,meta)=>NUT[k]?NUT[k].n:(meta&&meta[k]&&meta[k].n)||k;
const nutUnit=(k,meta)=>NUT[k]?NUT[k].u:(meta&&meta[k]&&meta[k].u)||'';
const sig3=v=>+(+v).toPrecision(3);
const isMetric=k=>METRICS.some(m=>m.k===k);
// The catalog nutrients beyond the five metrics, for an entry's snapshot (zeros and unknowns left out to keep entries small)
function moreOf(n){const o={}; for(const k in n) if(NUT[k]&&!isMetric(k)&&n[k]) o[k]=sig3(n[k]); return o}
// All catalog nutrients logged on a day, for detail views and reports
function dayNutrients(day){const t={}; for(const e of entriesFor(day)){METRICS.forEach(m=>t[m.k]=(t[m.k]||0)+(Number(e[m.k])||0)); for(const k in e.more||{}) t[k]=(t[k]||0)+e.more[k]} return t}
const entryNut=(e,k)=>isMetric(k)?Number(e[k])||0:(e.more&&e.more[k])||0;

/* ---------------- Micros on Today ---------------- */
// settings.micros: [{k, v, kind}] — the catalog nutrients Today shows under the macros, in order. v is your own daily
// amount, or null to follow the recommendation below (no target where there isn't one). kind is 'ceiling' (at most),
// 'floor' (at least) or 'target' (aim for). Sodium included: the dated targets still carry a sodium figure, unused.
const MACROS=METRICS.filter(m=>m.k!=='sodium');
const MICRO_CEILING=new Set(['sodium','cholesterol','satFat','transFat','sugars','addedSugars','alcohol','caffeine']);
const DEFAULT_MICROS=()=>[{k:'sodium',v:null,kind:'ceiling'},{k:'cholesterol',v:null,kind:'ceiling'}];
// The usual recommendation a micro follows until you set your own: FDA Daily Values for adults, and FDA's 400 mg for caffeine
const REC={sodium:2300,cholesterol:300,satFat:20,addedSugars:50,fiber:28,potassium:4700,calcium:1300,iron:18,magnesium:420,
  phosphorus:1250,zinc:11,copper:0.9,manganese:2.3,selenium:55,iodine:150,chloride:2300,chromium:35,molybdenum:45,vitA:900,vitC:90,
  vitD:20,vitE:15,vitK:120,thiamin:1.2,riboflavin:1.3,niacin:16,pantothenic:5,vitB6:1.7,biotin:30,folate:400,vitB12:2.4,choline:550,caffeine:400};
const MICRO_OPTIONS=NUTRIENTS.filter(x=>!MACROS.some(m=>m.k===x.k));
const MICRO_SHORT={sodium:'Na',cholesterol:'Chol',potassium:'K',calcium:'Ca',iron:'Fe',magnesium:'Mg',zinc:'Zn',satFat:'Sat fat',
  transFat:'Trans fat',monoFat:'Mono fat',polyFat:'Poly fat',addedSugars:'Added sugar'};
const microShort=k=>MICRO_SHORT[k]||NUT[k].n.replace(/^Vitamin /,'Vit ').replace(/ \(.*\)$/,'');
const microLimit=c=>c.v>0?c.v:REC[c.k]||null;
// Macros you've set yourself (settings.macroPins) keep their number through weekly check-ins; the rest follow your goal
const macroKind=m=>state.settings.macroKinds[m.k]||m.kind;
const fmtNut=v=>fmt(v,v>0&&v<10?1:0);
// Chosen micros as they read under an entry or a recipe
function microsMeta(get){return state.settings.micros.map(c=>` · ${microShort(c.k)} ${fmtNut(get(c.k))} ${NUT[c.k].u}`).join('')}

/* ---------------- Units ---------------- */
// Foods keep nutrition per 100 g (or per 100 ml for drinks). Amounts convert through grams or millilitres;
// crossing between weight and volume needs the food's density, so those units only show when it's known.
const UNITS={
  g:{kind:'mass',f:1,n:'g'}, oz:{kind:'mass',f:28.349523125,n:'oz'}, lb:{kind:'mass',f:453.59237,n:'lb'}, kg:{kind:'mass',f:1000,n:'kg'},
  ml:{kind:'volume',f:1,n:'ml'}, tsp:{kind:'volume',f:4.92892,n:'tsp'}, tbsp:{kind:'volume',f:14.7868,n:'tbsp'},
  floz:{kind:'volume',f:29.5735,n:'fl oz'}, cup:{kind:'volume',f:236.588,n:'cup'}, l:{kind:'volume',f:1000,n:'l'}};
const KIND_OF_BASE={g:'mass',ml:'volume'};
const unitKind=u=>u&&u.startsWith('srv:')?'serving':(UNITS[u]||{}).kind;

/* ---------------- State & storage ---------------- */
/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID='326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const LS_KEY='nutritionHelper.v1';
const uid6=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const nowIso=()=>new Date().toISOString();
// Settings change as a whole (newest wins on merge); entries, weigh-ins and foods are records merged by id.
const DEFAULT_DAY_PARTS=[2,8,14,20];
function defaultSettings(){return{
  weightUnit:'lb',
  unitPrefs:{mass:'g',volume:'ml'},   // last weight and volume unit used when logging, reused for every food
  usdaKey:'',
  profile:{sex:'',birthYear:null,heightCm:null,activity:1.375},   // for the starting expenditure estimate
  lengthUnit:'',   // 'cm' or 'in' for body measurements; empty follows the body weight unit
  measureSites:null,   // which body measurements to show; null is the default set
  micros:DEFAULT_MICROS(),   // micronutrients shown on Today, with optional limits (see Micros on Today)
  macroPins:{},   // {kcal:true,…}: macros set by hand, left alone by check-ins (see Daily targets)
  macroKinds:{},   // {carbs:'ceiling',…}: macros you track as at most / at least / aim for, over the usual
  weightOverlay:null,  // measurements drawn on the weight chart, on their own axis; null shows waist
  dayParts:[...DEFAULT_DAY_PARTS],   // start hours of the parts of the day the Foods page breaks usage into
  goal:null,   // {targetKg, ratePct (% body weight per week, negative to lose), startDate, startKg, proteinPerKg, fatPct}
  targets:[{from:'2000-01-01',...DEFAULT_TARGETS}],
  updatedAt:''
};}
const LISTS=['entries','weighins','foods','checkins','recipes','measurements'];
function emptyState(){return{settings:defaultSettings(),entries:[],weighins:[],foods:[],checkins:[],recipes:[],measurements:[],deleted:[]}}
let state=emptyState();

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function normalize(j){
  const s=emptyState();
  if(!j||typeof j!=='object') return s;
  s.settings=Object.assign(defaultSettings(),j.settings||{});

/* ---------------- Trend, expenditure & goal ---------------- */
// Trend weight smooths daily scale noise (exponential moving average, 10% per weigh-in).
// Expenditure comes from energy balance: over the last 3 weeks, average intake minus the change in trend weight
// (7,700 kcal per kg), eased in 10% a day. Until there's enough logging it starts from a profile estimate.
const KCAL_PER_KG=7700, TREND_ALPHA=0.1, TDEE_WINDOW=21, TDEE_ALPHA=0.1;
const ACTIVITY=[[1.2,'Mostly sitting'],[1.375,'Lightly active'],[1.55,'Moderately active'],[1.725,'Very active'],[1.9,'Extremely active']];
const PACES=[-1,-0.75,-0.5,-0.25,0,0.25,0.5];   // % of body weight per week
const daysBetween=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
function bmrFor(kg){
  const p=state.settings.profile; if(!p||!p.sex||!p.birthYear||!p.heightCm||!kg) return null;
  const age=new Date().getFullYear()-p.birthYear;
  return 10*kg+6.25*p.heightCm-5*age+(p.sex==='female'?-161:5);
}
const profileTdee=kg=>{const b=bmrFor(kg); return b?b*(state.settings.profile.activity||1.375):null};
let MODEL=null;
function model(){
  if(MODEL) return MODEL;
  const intake={}, scale={};
  for(const e of state.entries){const d=intake[e.date]||(intake[e.date]={n:0}); d.n++; METRICS.forEach(m=>d[m.k]=(d[m.k]||0)+(Number(e[m.k])||0))}
  for(const w of state.weighins) scale[w.date]=w;
  const all=[...Object.keys(intake),...Object.keys(scale)].sort(), today=todayKey();
  const days=[];
  if(all.length){
    let trend=null, tdee=null, dataDays=0;
    for(let d=all[0]; d<=today; d=addDays(d,1)){
      const s=scale[d];
      if(s) trend=trend==null?s.kg:trend+TREND_ALPHA*(s.kg-trend);
      const row={date:d,scale:s?s.kg:null,fat:s&&s.fat!=null?s.fat:null,trend,intake:intake[d]||null,tdee:null};
      days.push(row);
      const i=days.length-1;
      if(tdee==null&&trend!=null) tdee=profileTdee(trend);
      // Today is still being logged, so it doesn't count yet
      if(d!==today&&i>=TDEE_WINDOW){
        const start=days[i-TDEE_WINDOW].trend, win=days.slice(i-TDEE_WINDOW+1,i+1).filter(r=>r.intake);
        if(start!=null&&trend!=null&&win.length>=TDEE_WINDOW*0.6){
          const raw=win.reduce((a,r)=>a+r.intake.kcal,0)/win.length-(trend-start)*KCAL_PER_KG/TDEE_WINDOW;
          tdee=tdee==null?raw:tdee+TDEE_ALPHA*(raw-tdee); dataDays++;
        }
      }
      row.tdee=tdee;
    }
    MODEL={days,byDate:Object.fromEntries(days.map(r=>[r.date,r])),dataDays};
  }else MODEL={days,byDate:{},dataDays:0};
  const last=days[days.length-1];
  MODEL.trendNow=last?last.trend:null;
  MODEL.tdeeNow=last&&last.tdee!=null?Math.round(last.tdee):null;
  return MODEL;
}
// Daily calories for a pace: expenditure plus the energy of the weekly change, never below resting needs when losing
function planFor(ratePct){
  const M=model(), kg=M.trendNow; if(kg==null||M.tdeeNow==null) return null;
  const weeklyKg=kg*ratePct/100, want=M.tdeeNow+weeklyKg*KCAL_PER_KG/7;
  const floor=ratePct<0?Math.max(1200,Math.round(bmrFor(kg)||0)):0;
  return {ratePct,weeklyKg,kcal:Math.round(Math.max(want,floor)/10)*10,clamped:want<floor};
}
function goalTiming(targetKg,ratePct){
  const kg=model().trendNow; if(kg==null||!ratePct) return null;
  const weeks=(targetKg-kg)/(kg*ratePct/100);
  return weeks>0?{weeks,date:addDays(todayKey(),Math.ceil(weeks*7))}:null;
}
// Macros for a calorie budget: protein from trend weight, fat a share of calories, carbs the rest. Any you've set
// yourself stay as they are (and the rest work around them); without a goal, the defaults stand in.
function macrosFor(kcal){
  const g=state.settings.goal, kg=model().trendNow, cur=targetsFor(todayKey()), pin=state.settings.macroPins;
  if(pin.kcal) kcal=cur.kcal;
  const protein=pin.protein?cur.protein:g&&kg!=null?Math.round((g.proteinPerKg||1.8)*kg):DEFAULT_TARGETS.protein;
  const fat=pin.fat?cur.fat:Math.round(kcal*(g&&g.fatPct||30)/100/9);
  const carbs=pin.carbs?cur.carbs:Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,fat,carbs,sodium:cur.sodium};
}
// The calorie budget when it isn't set by hand: this week's plan from your goal, or the default without one
function usualKcal(){const p=state.settings.goal&&proposal(); return p?p.kcal:state.settings.goal?targetsFor(todayKey()).kcal:DEFAULT_TARGETS.kcal}
const goalReached=g=>{const kg=model().trendNow; return kg!=null&&(g.ratePct<0?kg<=g.targetKg:g.ratePct>0?kg>=g.targetKg:false)};
// The planned path from where the goal started, at the pace chosen then, flat once the target is reached.
// A goal set before any weigh-in starts from the first trend weight after it.
function setpointOn(d){
  const g=state.settings.goal; if(!g||!g.startDate||d<g.startDate) return null;
  let kg=g.startKg, from=g.startDate;
  if(kg==null){const r=model().days.find(r=>r.date>=g.startDate&&r.trend!=null); if(!r||d<r.date) return null; kg=r.trend; from=r.date}
  const w=kg+kg*g.ratePct/100*daysBetween(from,d)/7;
  return g.ratePct<0?Math.max(w,g.targetKg):g.ratePct>0?Math.min(w,g.targetKg):kg;
}
function proposal(){
  const g=state.settings.goal; if(!g) return null;
  const rate=goalReached(g)?0:g.ratePct, p=planFor(rate); if(!p) return null;
  return {...p,targets:macrosFor(p.kcal),reached:rate===0&&g.ratePct!==0};
}
const lastCheckin=()=>[...state.checkins].sort((a,b)=>a.date<b.date?1:-1)[0];
function checkinDue(){
  if(!state.settings.goal||model().tdeeNow==null) return false;
  const c=lastCheckin(), t=todayKey();
  return (!c||daysBetween(c.date,t)>=7)&&lsGet('nh.snooze')!==t;
}
function applyProposal(p){
  const t=todayKey(), M=model();
  state.settings.targets=state.settings.targets.filter(x=>x.from!==t).concat({from:t,...p.targets}); touchSettings();
  putRecord('checkins',{id:'c'+uid6(),date:t,tdee:M.tdeeNow,trendKg:M.trendNow,ratePct:p.ratePct,...p.targets});
}

/* ---------------- Google Drive sync ---------------- */
/* ===== Google sign-in shared by petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/google-token.js (see STANDARDS.md, "Staying connected to Google Drive").
   Every app lives on petravanta.github.io and uses the same OAuth client, so a Drive token one app gets works in all of them.
   This keeps that token where every app can see it (localStorage key petravanta.google), one per Google account, so
   reconnecting in one app reconnects them all, and an app only ever uses the token of the account it connected with.
   Google gives a static site no refresh token: a token lasts an hour, and getting a new one opens Google's window,
   which browsers only allow right after a tap. With the account's email as a hint, that window closes by itself. */
const GoogleToken=(()=>{
  const KEY='petravanta.google', SCOPE='https://www.googleapis.com/auth/drive.file';
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(e){return {}}};
  const write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
  const subs=[];
  // Another tab or app on this site got a token: let this one pick it up without a tap
  window.addEventListener('storage',e=>{if(e.key===KEY) subs.forEach(f=>{try{f()}catch(_){}})});
  function gis(){return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej({code:'offline'}); document.head.appendChild(s)})}
  // A token for this account with time left on it, or null
  function get(email){const t=email&&(read().tokens||{})[email]; return t&&t.exp>Date.now()?t:null}
  // o: {clientId, hint:'email to suggest', prompt:'' | 'select_account' | 'consent'}. Call from a tap. Resolves {token, exp, email}.
  function request(o){return new Promise(async(res,rej)=>{
    try{await gis()}catch(e){return rej(e)}
    google.accounts.oauth2.initTokenClient({client_id:o.clientId,scope:SCOPE,login_hint:o.hint||undefined,error_callback:rej,
      callback:async r=>{
        if(r.error) return rej(r);
        const t={token:r.access_token,exp:Date.now()+(Number(r.expires_in||3600)-60)*1000};
        // Which account it is, so the token is filed under the right one
        let email='';
        try{const j=await (await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+t.token}})).json(); email=(j.user&&j.user.emailAddress)||''}catch(e){}
        if(!email) email=o.hint||'';
        if(email){
          const v=read(), now=Date.now(); v.tokens=v.tokens||{};
          for(const k in v.tokens) if(!(v.tokens[k].exp>now)) delete v.tokens[k];
          v.tokens[email]=t; v.last=email; write(v);
        }
        res({...t,email});
      }
    }).requestAccessToken({prompt:o.prompt||''});
  })}
  // Signing out on this browser. Google's permission stays, since the other apps and devices still use it.
  function forget(email){const v=read(); if(v.tokens&&email) delete v.tokens[email]; write(v)}
  return {get,request,forget,gis,onChange:f=>subs.push(f),get lastEmail(){return read().last||''}};
})();
/* ===== end Google sign-in ===== */
// Uses the drive.file scope, so the app can only see the one file it creates.
const DRIVE_FILE='Nutrition Helper data.json', DAPI='https://www.googleapis.com';
const Drive={token:null,exp:0,fileId:lsGet('nh.driveFile'),on:!!lsGet('nh.driveOn'),busy:false,last:null,timer:null,err:null,lastAsk:0,email:lsGet('nh.driveEmail')||''};
// The app's own token from before tokens were shared (GoogleToken above); good until it runs out
(()=>{const t=lsGet('nh.driveTok'); if(Drive.on&&t&&t.exp>Date.now()){Drive.token=t.token;Drive.exp=t.exp} try{localStorage.removeItem('nh.driveTok')}catch(e){}})();
const driveConfigured=()=>!!GOOGLE_CLIENT_ID;
const driveLive=()=>{
  const g=GoogleToken.get(Drive.email); if(g&&g.exp>Drive.exp){Drive.token=g.token;Drive.exp=g.exp}
  return !!Drive.token&&Date.now()<Drive.exp;
};
// Opens Google's window, so call it from a tap. A first connect suggests the account the other apps use; after that, this app's account.
async function driveToken(){
  const r=await GoogleToken.request({clientId:GOOGLE_CLIENT_ID,hint:Drive.email||(Drive.on?'':GoogleToken.lastEmail),prompt:Drive.on||GoogleToken.lastEmail?'':'consent'});
  Drive.token=r.token; Drive.exp=r.exp;
  if(r.email&&r.email!==Drive.email){Drive.email=r.email; lsSet('nh.driveEmail',r.email)}
}
async function dfetch(path,opt={}){
  if(!driveLive()) throw {code:'expired'};
  const r=await fetch(DAPI+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+Drive.token}});
  if(r.status===401){Drive.token=null; Drive.exp=0; GoogleToken.forget(Drive.email); throw {code:'expired'}}
  if(!r.ok) throw {code:'http',status:r.status};
  return r;
}
async function driveFind(){
  if(Drive.fileId){
    try{const j=await (await dfetch(`/drive/v3/files/${Drive.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return Drive.fileId}
    catch(e){if(e.code==='expired') throw e}
  }
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j=await (await dfetch(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
  Drive.fileId=j.files&&j.files[0]?j.files[0].id:null; lsSet('nh.driveFile',Drive.fileId);
  return Drive.fileId;
}
const snapshot=()=>({app:'nutrition-helper',v:1,saved:nowIso(),...state});
async function driveRead(){const id=await driveFind(); return id?(await dfetch(`/drive/v3/files/${id}?alt=media`)).json():null}
async function driveWrite(){
  const body=JSON.stringify(snapshot());
  const id=await driveFind();
  if(id){await dfetch(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
  const b='nh'+uid6(), meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
  const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j=await (await dfetch('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi})).json();

// Combine another copy (Drive or a backup) with this browser: records from both minus deletions, the newer edit of each record, the newer settings
function mergeIn(r){
  if(!r||r.app!=='nutrition-helper') return false;
  const o=normalize(r), before=JSON.stringify(state);
  const del=new Set([...state.deleted,...o.deleted]);
  MODEL=null;
  for(const k of LISTS){
    const byId=new Map();
    [...o[k],...state[k]].forEach(x=>{if(!x.id||del.has(x.id)) return; const h=byId.get(x.id); if(!h||(x.u||'')>=(h.u||'')) byId.set(x.id,x)});
    state[k]=[...byId.values()];
  }
  state.deleted=[...del];
  if((o.settings.updatedAt||'')>(state.settings.updatedAt||'')) state.settings=o.settings;
  lsSet(LS_KEY,state);
  return JSON.stringify(state)!==before;
}
function driveStatus(){
  if(!driveConfigured()||!Drive.on) return null;
  if(Drive.busy) return 'Syncing with Google Drive…';
  if(Drive.err) return Drive.err;
  if(!driveLive()) return 'Google Drive paused';
  return 'Synced to Google Drive'+(Drive.last?' · '+Drive.last.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'');
}
function showDriveStatus(){const t=driveStatus(); setSaveState(t||'Saved in this browser'); const b=document.getElementById('driveResume'); if(b) b.hidden=!(driveConfigured()&&Drive.on&&!driveLive()&&!Drive.busy)}
async function driveSync(interactive){
  if(Drive.busy) return;

    Drive.busy=true; Drive.err=null; showDriveStatus();

    if(e&&e.code!=='expired') Drive.err=(e.type==='popup_closed'||e.error==='access_denied')?null:'Couldn’t reach Google Drive';
    if(interactive&&Drive.err) toast('Couldn’t connect to Google Drive. Everything is still saved in this browser.');
  }finally{Drive.busy=false; showDriveStatus(); if(tab==='settings'&&!sheet) render()}
}
function driveSoon(){

}

function bodyColumns(sites){
  const y=k=>BODY_MID_Y[k]?BODY_MID_Y[k]:bodyAnchor(k)[1], l=[], r=[];
  for(const k of [...sites].sort((a,b)=>y(a)-y(b))){
    if(k.endsWith('R')&&!BODY_MID_Y[k]) l.push(k); else if(k.endsWith('L')&&!BODY_MID_Y[k]) r.push(k);

  const mids=sites.filter(k=>BODY_MID_Y[k]).sort((a,b)=>y(a)-y(b));

// Takes the targets as typed. A macro with a number is pinned; one cleared goes back to what the goal gives, and the

function readTargetsForm(){
  const form=document.getElementById('targetsForm'); if(!form) return false;
  const f=new FormData(form), td=todayKey(), cur=targetsFor(td), was=state.settings.macroPins, pins={}, kinds={}, next={...cur,from:td}, changed=new Set();
  for(const m of MACROS){
    const v=num(f.get('v:'+m.k)), kind=f.get('kind:'+m.k);
    if(kind&&kind!==m.kind) kinds[m.k]=kind;
    if(v>0){pins[m.k]=true; if(v!==cur[m.k]){next[m.k]=v; changed.add(m.k)}}
    else if(was[m.k]) changed.add(m.k);
  }
  state.settings.macroPins=pins; state.settings.macroKinds=kinds;
  const g=state.settings.goal, kg=model().trendNow;
  if(!pins.kcal&&was.kcal) next.kcal=usualKcal();
  if(!pins.protein&&was.protein) next.protein=g&&kg!=null?Math.round((g.proteinPerKg||1.8)*kg):DEFAULT_TARGETS.protein;
  if(!pins.fat&&(was.fat||changed.has('kcal'))) next.fat=Math.round(next.kcal*(g&&g.fatPct||30)/100/9);
  if(!pins.carbs&&(was.carbs||changed.size)) next.carbs=Math.max(0,Math.round((next.kcal-next.protein*4-next.fat*9)/4));
  if(MACROS.some(m=>next[m.k]!==cur[m.k])) state.settings.targets=state.settings.targets.filter(x=>x.from!==td).concat(next);
  state.settings.micros=state.settings.micros.map(c=>{
    const v=num(f.get('v:'+c.k)), kind=f.get('kind:'+c.k)||c.kind;
    return {k:c.k,v:v>0&&v!==REC[c.k]?v:null,kind};
  });

}

// Hand-drawn SVG, sized to the card. Each chart is one measure on one axis; hovering shows every series at that date.
const RANGES=[['1m','1M',30],['3m','3M',91],['6m','6M',182],['1y','1Y',365],['all','All',0]];

const CHARTS={};
const shortDate=k=>parseDay(k).toLocaleDateString([], {month:'short',day:'numeric'});

function niceTicks(lo,hi,n=4){
  if(lo===hi){lo-=1;hi+=1}
  const raw=(hi-lo)/n, mag=10**Math.floor(Math.log10(raw)), step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step, out=[]; for(let v=a; v<=hi+step*0.001; v+=step) out.push(+v.toFixed(6));
  if(out[out.length-1]<hi) out.push(+(out[out.length-1]+step).toFixed(6));
  return out;
}
// Rows for the chosen range: one per day, or one per week (averages) when the range is long
function chartRows(){
  const M=model(); if(!M.days.length) return {rows:[],weekly:false};
  const days=RANGES.find(r=>r[0]===range)[2], t=todayKey(), from=days?addDays(t,-days+1):M.days[0].date;
  const sel=M.days.filter(r=>r.date>=from);
  const weekly=sel.length>120;
  const row=r=>{const tg=targetsFor(r.date); return {date:r.date,scale:r.scale,trend:r.trend,bf:r.fat,tdee:r.tdee,goal:setpointOn(r.date),
    ...Object.fromEntries(METRICS.map(m=>[m.k,r.intake?r.intake[m.k]:null])),...Object.fromEntries(METRICS.map(m=>['t_'+m.k,tg[m.k]]))}};
  if(!weekly) return {rows:sel.map(row),weekly};
  const out=[];
  for(let i=0;i<sel.length;i+=7){
    const wk=sel.slice(i,i+7).map(row), avg=k=>{const v=wk.map(r=>r[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const o={date:wk[0].date,end:wk[wk.length-1].date}; Object.keys(wk[0]).forEach(k=>{if(k!=='date') o[k]=avg(k)}); o.trend=wk[wk.length-1].trend; o.goal=wk[wk.length-1].goal; o.tdee=wk[wk.length-1].tdee; out.push(o);

// spec: {id, title, unit, dp, rows, series:[{k, name, mark:'bar'|'line'|'dots'|'dash', color:'a'|'b'|'ink'|'faint', conv?}], zero?}
function chartCard(spec){

    <div class="chart" data-chart="${spec.id}"></div>${spec.foot||''}
    <details><summary class="small muted">Data table</summary><div class="tbl"><table><thead><tr><th>${spec.weekly?'Week of':'Date'}</th>${spec.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead>
      <tbody>${tableRows.map(r=>`<tr><td>${esc(shortDate(r.date))}</td>${spec.series.map(s=>`<td>${r[s.k]==null?'–':fmt(s.conv?s.conv(r[s.k]):r[s.k],s.dp??spec.dp)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

function drawChart(el){
  const spec=CHARTS[el.dataset.chart]; if(!spec) return;
  const rows=spec.rows, n=rows.length, W=Math.max(260,el.clientWidth), H=spec.h||180, pl=44, pt=8, pb=22; let pr=10;
  const val=(s,r)=>r[s.k]==null?null:(s.conv?s.conv(r[s.k]):r[s.k]);
  // Series with axis:'r' (measurements on the weight chart) get their own scale, labelled on the right
  const left=spec.series.filter(s=>s.axis!=='r'), right=spec.series.filter(s=>s.axis==='r');
  // 'stack' series pile up per row (protein, fat and carbs), so the scale needs their totals
  const stacks=left.filter(s=>s.mark==='stack'), stackSum=r=>stacks.reduce((a,s)=>a+(val(s,r)||0),0);
  const vals=[...left.flatMap(s=>rows.map(r=>val(s,r))),...(stacks.length?rows.map(stackSum):[])].filter(v=>v!=null), rvals=right.flatMap(s=>rows.map(r=>val(s,r))).filter(v=>v!=null);
  if(rvals.length) pr=44;
  if(!vals.length){el.innerHTML='<p class="empty">No data in this range yet.</p>';return}
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(spec.zero) lo=Math.min(0,lo); else {const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad}
  const ticks=niceTicks(lo,hi); lo=spec.zero?0:ticks[0]; hi=ticks[ticks.length-1];
  const bw=(W-pl-pr)/n, x=i=>pl+(i+0.5)*bw, y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1)), yl=y;
  let g=ticks.filter(v=>v>=lo&&v<=hi).map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v,hi-lo<5?1:0)}</text>`).join('');
  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((W-pl)/70)))), lab=spec.weekly||n>120?monthYear:shortDate;
  for(let i=0;i<n;i+=every) g+=`<text class="tick" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(lab(rows[i].date))}</text>`;
  let ry=null;
  if(rvals.length){
    let a=Math.min(...rvals), b=Math.max(...rvals); const p=(b-a)*0.08||1; const rt=spec.zero?niceTicks(0,b):niceTicks(a-p,b+p); a=rt[0]; b=rt[rt.length-1];
    ry=v=>pt+(H-pt-pb)*(1-(v-a)/(b-a||1));
    const st=rt[1]-rt[0], rdp=st>=1?0:Math.abs(st*10-Math.round(st*10))<1e-9?1:2;
    g+=rt.map(v=>`<text class="tick r" x="${W-pr+6}" y="${ry(v)+4}" text-anchor="start">${fmt(v,rdp)}</text>`).join('');
  }
  for(const s of spec.series){
    const pts=rows.map((r,i)=>[i,val(s,r)]), y=s.axis==='r'?ry:yl;
    if(s.mark==='stack'){
      const w=Math.max(1,Math.min(16,bw-2));
      g+=pts.filter(p=>p[1]!=null&&p[1]>0).map(([i,v])=>{const b0=stacks.slice(0,stacks.indexOf(s)).reduce((a,t)=>a+(val(t,rows[i])||0),0);
        return `<rect class="bar c-${s.color}" x="${x(i)-w/2}" y="${y(b0+v)}" width="${w}" height="${Math.max(0,y(b0)-y(b0+v))}"/>`}).join('');
    }else if(s.mark==='bar'){
      const w=Math.max(1,Math.min(16,bw-2)), r0=Math.min(2,w/2);
      g+=pts.filter(p=>p[1]!=null).map(([i,v])=>{const top=y(Math.max(v,lo)), h=Math.max(0,y(lo)-top); return `<path class="bar c-${s.color}" d="M${x(i)-w/2},${top+h}V${top+r0}q0,-${r0} ${r0},-${r0}h${w-2*r0}q${r0},0 ${r0},${r0}V${top+h}Z"/>`}).join('');
    }else if(s.mark==='dots'){
      g+=pts.filter(p=>p[1]!=null).map(([i,v])=>`<circle class="dot c-${s.color}" cx="${x(i)}" cy="${y(v)}" r="${n>200?2:3}"/>`).join('');
    }else{
      let d='', pen=false;
      for(const [i,v] of pts){if(v==null){pen=false;continue} d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); pen=true}
      // a target is a step: hold each value across its whole slot
      if(s.mark==='step'){d='';pen=false;for(const [i,v] of pts){if(v==null){pen=false;continue} const a=x(i)-bw/2,b=x(i)+bw/2; d+=(pen?'L':'M')+a.toFixed(1)+','+y(v).toFixed(1)+'L'+b.toFixed(1)+','+y(v).toFixed(1); pen=true}}

    }

  g+=`<line class="cross" id="x-${spec.id}" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)} chart. The data table below lists the values.">${g}<rect class="hit" x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" tabindex="0"/></svg><div class="tip" hidden></div>`;
  el._geo={pl,bw,n,x,W};
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(drawChart)}
function chartHover(el,clientX){

function chartLeave(el){const l=el.querySelector('.cross'), t=el.querySelector('.tip'); if(l) l.setAttribute('visibility','hidden'); if(t) t.hidden=true}

// One row per day across the range (per week when long): the carried value, and the reading on days it was measured
function measureChartRows(k){
  const ms=measuresSorted().filter(m=>m.v&&m.v[k]!=null); if(!ms.length) return {rows:[],weekly:false};
  const days=RANGES.find(r=>r[0]===range)[2], t=todayKey(), from=days?addDays(t,-days+1):measuresSorted()[0].date, n=Math.round((parseDay(t)-parseDay(from))/864e5)+1;
  const weekly=n>120, step=weekly?7:1, rows=[];

function cellDay(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5); return dkey(d)}   // SheetJS dates can land just before local midnight
  if(typeof v==='number'&&v>20000&&v<80000) return dkey(new Date(Math.round((v-25569)*864e5)+12*36e5+new Date().getTimezoneOffset()*6e4));   // a date cell that lost its date format
  const s=String(v??'').trim(), m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)||s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  return m[1].length===4?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:`${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
}
// Find a column by the start of its header, e.g. col(row,/^calories/)
const col=(row,re)=>{const k=Object.keys(row).find(h=>re.test(h.trim().toLowerCase())); return k==null?null:row[k]};
const colName=(rows,re)=>rows.length?Object.keys(rows[0]).find(h=>re.test(h.trim().toLowerCase())):null;
// MacroFactor names nutrient columns like "Vitamin C (mg)"; match them to the catalog by name, keep the rest as mf:<name>
const MF_NOT_NUTRIENT=/^(date|food name|serving|calories|protein|fat \(|fat$|carbs|time|meal|brand|notes?|expenditure|target|weight|trend)/;
const MF_ALIAS={'vitamin b1':'thiamin','vitamin b2':'riboflavin','vitamin b3':'niacin','vitamin b5':'pantothenic','vitamin b7':'biotin','vitamin b9':'folate',
  'folic acid':'folate','sugar':'sugars','sugars added':'addedSugars','saturated':'satFat','monounsaturated':'monoFat','polyunsaturated':'polyFat',
  'trans':'transFat','trans fat':'transFat','omega 3':'omega3','omega 6':'omega6','omega-3':'omega3','omega-6':'omega6','dietary fiber':'fiber'};
function mfNutrientKey(name){
  const s=name.toLowerCase().replace(/\s+/g,' ').trim();
  if(MF_ALIAS[s]) return MF_ALIAS[s];
  const x=NUTRIENTS.find(n=>n.n.toLowerCase()===s||n.n.toLowerCase().replace(/ \(.*\)$/,'')===s||n.k.toLowerCase()===s.replace(/ /g,''));
  return x?x.k:null;
}
function mfNutrients(row,scale){
  const per100={}, nmeta={};
  for(const h of Object.keys(row)){
    const head=h.trim(), lower=head.toLowerCase(); if(MF_NOT_NUTRIENT.test(lower)) continue;
    const v=num(row[h]); if(v==null) continue;
    const m=head.match(/^(.*?)\s*\(([^)]+)\)\s*$/), name=(m?m[1]:head).trim(), unit=normUnit(m?m[2]:'');
    const k=mfNutrientKey(name);
    if(k){const c=k==='kcal'?v:convertMass(v,unit||NUT[k].u,NUT[k].u); if(c!=null) per100[k]=c*scale; continue}
    const key='mf:'+name.toLowerCase(); per100[key]=v*scale; nmeta[key]={n:name,u:unit};
  }
  return {per100,nmeta};
}
function readMacroFactor(XLSX,buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const sheet=n=>{const k=wb.SheetNames.find(s=>s.trim().toLowerCase()===n); return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:null,raw:true}):[]};
  const macros=sheet('calories & macros'), micros=sheet('micronutrients'), scale=sheet('scale weight');
  if(!macros.length&&!scale.length) throw new Error('not-mf');
  const microsOn={}; for(const r of micros){const d=cellDay(col(r,/^date/)); if(d) microsOn[d]=mfNutrients(r,1).per100}
  const days=[];
  for(const r of macros){
    const d=cellDay(col(r,/^date/)); if(!d) continue;
    const all={...mfNutrients(r,1).per100,...(microsOn[d]||{})};
    const t={kcal:num(col(r,/^calories/))||0,protein:num(col(r,/^protein/))||0,fat:num(col(r,/^fat/))||0,carbs:num(col(r,/^carbs/))||0,sodium:all.sodium||0};
    if(t.kcal>0||t.protein>0) days.push({date:d,...t,more:moreOf(all)});
  }
  const wcol=colName(scale,/^weight/)||'', toKg=/kg/i.test(wcol)?1:KG_PER_LB;
  const weighins=[];
  for(const r of scale){
    const d=cellDay(col(r,/^date/)), w=num(col(r,/^weight/)); if(!d||!w) continue;
    let f=num(col(r,/^fat/)); if(f!=null&&f>0&&f<1) f*=100;
    weighins.push({date:d,kg:+(w*toKg).toFixed(3),fat:f||null});
  }
  const foods=new Map();
  for(const r of [...sheet('custom foods'),...sheet('favorites')]){
    const name=String(col(r,/^food name/)||'').trim(), g=num(col(r,/^serving weight/)); if(!name||!g||g<=0||foods.has(name.toLowerCase())) continue;
    const per=k=>(num(col(r,k))||0)*100/g, qty=num(col(r,/^serving qty/)), size=String(col(r,/^serving size/)||'').trim(), all=mfNutrients(r,100/g);
    foods.set(name.toLowerCase(),{name,brand:'',barcode:'',source:'custom',ext:'mf:'+name.toLowerCase(),base:'g',
      per100:{...all.per100,kcal:per(/^calories/),protein:per(/^protein/),fat:per(/^fat \(/),carbs:per(/^carbs/),sodium:all.per100.sodium||0},
      ...(Object.keys(all.nmeta).length?{nmeta:all.nmeta}:{}),
      servings:[{n:size?`${qty&&qty!==1?fmtQty(qty)+' ':''}${size}`:`${fmtQty(g)} g`,amt:g}]});
  }
  const prof=sheet('user profile')[0], profile={};
  if(prof){
    const sex=String(col(prof,/^sex/)||'').toLowerCase(), bd=cellDay(col(prof,/^birthday/)), h=num(col(prof,/^height/));
    if(sex.startsWith('f')) profile.sex='female'; else if(sex.startsWith('m')) profile.sex='male';
    if(bd) profile.birthYear=+bd.slice(0,4);
    if(h) profile.heightCm=+(h*(/cm/i.test(Object.keys(prof).find(k=>/^height/i.test(k))||'')?1:2.54)).toFixed(1);
  }
  return {days:days.sort((a,b)=>a.date<b.date?-1:1),weighins:weighins.sort((a,b)=>a.date<b.date?-1:1),foods:[...foods.values()],profile};
}
// What would change: days you've already logged in this app, and weigh-ins already here, are left alone
function importPlan(x){
  const own=new Set(state.entries.filter(e=>!e.imported).map(e=>e.date));
  const ownW=new Set(state.weighins.filter(w=>!w.imported).map(w=>w.date));
  const haveFood=new Set(state.foods.map(f=>f.name.toLowerCase()));
  return {days:x.days.filter(d=>!own.has(d.date)),weighins:x.weighins.filter(w=>!ownW.has(w.date)),foods:x.foods.filter(f=>!haveFood.has(f.name.toLowerCase())||foodByExt(f.ext)),
    skippedDays:x.days.length-x.days.filter(d=>!own.has(d.date)).length,profile:x.profile};
}
function applyImport(p){
  const u=nowIso();
  const up=(list,rec)=>{rec.u=u; const a=state[list], i=a.findIndex(r=>r.id===rec.id); i>=0?a[i]=rec:a.push(rec)};
  for(const d of p.days) up('entries',{id:'mf-'+d.date,date:d.date,ts:d.date,name:'MacroFactor daily total',imported:'macrofactor',...d});
  for(const w of p.weighins) up('weighins',{id:'mfw-'+w.date,imported:'macrofactor',...w});
  for(const f of p.foods){const have=foodByExt(f.ext); up('foods',{...(have||{uses:0}),...f,id:have?have.id:'f'+uid6()})}
  const pr=state.settings.profile;
  if(!pr.sex&&!pr.birthYear&&!pr.heightCm&&Object.keys(p.profile).length){Object.assign(pr,p.profile); state.settings.updatedAt=u}
  saveLocal();
}
const rangeText=list=>list.length?`${esc(parseDay(list[0].date).toLocaleDateString([], {month:'short',year:'numeric'}))} to ${esc(parseDay(list[list.length-1].date).toLocaleDateString([], {month:'short',year:'numeric'}))}`:'';
function sheetImport(){
  const p=sheet.plan;
  if(!p) return `<h2>Import from MacroFactor</h2><p class="note"><span class="spin"></span>Reading ${esc(sheet.fileName||'the file')}…</p>`;
  const nothing=!p.days.length&&!p.weighins.length&&!p.foods.length;
  return `<h2>Import from MacroFactor</h2>
    <p class="small muted">${esc(sheet.fileName)}</p>
    <ul class="small">
      <li><b>${fmt(p.days.length)}</b> days of food totals${p.days.length?`, ${rangeText(p.days)}`:''}</li>
      <li><b>${fmt(p.weighins.length)}</b> weigh-ins${p.weighins.length?`, ${rangeText(p.weighins)}`:''}</li>
      <li><b>${fmt(p.foods.length)}</b> custom foods and favorites</li>
      ${Object.keys(p.profile).length&&!state.settings.profile.sex?'<li>Your profile (sex, birth year, height)</li>':''}
    </ul>
    ${p.skippedDays?`<p class="note">Days you’ve already logged in this app (${fmt(p.skippedDays)}) are left as they are.</p>`:''}
    <p class="note">Each day comes in as one daily total, since the export doesn’t list individual meals. Your trend weight, expenditure and charts include it straight away.</p>
    <div class="row">${nothing?'<p class="small">Nothing new to import.</p>':'<button class="btn primary big" data-act="doImport">Import</button>'}<button class="btn ghost" data-close="1">Cancel</button></div>`;
}
async function startImport(file){
  openSheet({type:'import',fileName:file.name,plan:null});
  try{
    const XLSX=await loadSheetJs(), x=readMacroFactor(XLSX,await file.arrayBuffer());
    if(!sheet||sheet.type!=='import') return;
    sheet.plan=importPlan(x); renderSheet();
  }catch(e){
    closeSheet();
    toast(e.message==='xlsx'?'Couldn’t load the spreadsheet reader. Check your connection and try again.':'That file doesn’t look like a MacroFactor export (.xlsx).');
  }
}

// Every nutrient the food has for this portion, grouped like a label; unknown extras last
function moreHtml(f,qty,unit){

  for(const k in n){if(isMetric(k)||!n[k]) continue; const g=NUT[k]?NUT[k].g:'More'; (groups[g]||(groups[g]=[])).push(k)}

  if(!sheet){h.innerHTML='';return}
  const body={food:sheetFood,quick:sheetQuick,editFood:sheetEditFood,scan:sheetScan,goal:sheetGoal,import:sheetImport,
    recipe:sheetRecipe,editRecipe:sheetEditRecipe,saveRecipe:sheetSaveRecipe,move:sheetMove}[sheet.type]();
  h.innerHTML=`<div class="scrim" data-close="1"></div><div class="drawer" role="dialog" aria-modal="true"><button class="x" data-close="1" aria-label="Close">×</button>${body}</div>`;
  const first=h.querySelector('#pQty,#quickAdd input,#foodForm input,#gTarget,#rQty,#saveRecipeForm input');
  if(first) first.focus({preventScroll:true});
  if(sheet.type==='scan') startScan();
}
function openSheet(s){stopScan(); if(!sheet) pushLayer('sheet'); sheet=s; renderSheet()}
function closeSheet(fromBack){stopScan(); const was=sheet; sheet=null; renderSheet(); if(was&&!fromBack) dropLayer('sheet')}

// The phone's back button closes the top layer (a sheet, then the Add food overlay) instead of leaving the app.
// Each open layer has a history entry; closing one from a button steps back over it.
const layers=[]; let backsPending=0, pushesWaiting=[];
function pushLayer(k){
  if(backsPending){pushesWaiting.push(k); return}   // pushing before a pending back lands would get undone by it
  history.pushState({nh:k},''); layers.push(k);
}
function swapLayer(from,to){
  const i=pushesWaiting.lastIndexOf(from); if(i>=0){pushesWaiting[i]=to; return}
  if(layers[layers.length-1]===from) layers[layers.length-1]=to; else pushLayer(to);
}
function dropLayer(k){
  const i=pushesWaiting.lastIndexOf(k); if(i>=0){pushesWaiting.splice(i,1); return}
  if(layers[layers.length-1]!==k) return;
  layers.pop(); backsPending++; history.back();
}
window.addEventListener('popstate',()=>{
  if(backsPending){
    if(--backsPending===0){const w=pushesWaiting; pushesWaiting=[]; w.forEach(pushLayer)}
    return;
  }
  const k=layers.pop();
  if(k==='sheet') closeSheet(true);
  else if(k==='adder') closeAdder(true);
});

/* ---------------- Barcode scanning ---------------- */
// Native BarcodeDetector where the browser has it (Chrome on Android); ZXing from a CDN elsewhere (iPhone Safari).
const scan={stream:null,timer:null,zx:null,busy:false};
function loadZxing(){return new Promise((res,rej)=>{
  if(window.ZXingBrowser) return res(window.ZXingBrowser);
  const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
  sc.onload=()=>window.ZXingBrowser?res(window.ZXingBrowser):rej(new Error('zxing')); sc.onerror=()=>rej(new Error('zxing')); document.head.appendChild(sc)})}
async function startScan(){
  const v=document.getElementById('scanVideo'), note=document.getElementById('scanNote');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){note.textContent='This browser can’t use the camera. Type the barcode number instead.';return}
  try{
    if('BarcodeDetector' in window){
      const fmts=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      const want=['ean_13','ean_8','upc_a','upc_e'].filter(f=>fmts.includes(f));
      if(want.length){
        const det=new BarcodeDetector({formats:want});
        scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        if(!sheet||sheet.type!=='scan'){stopScan();return}
        v.srcObject=scan.stream; await v.play();
        scan.timer=setInterval(async()=>{if(scan.busy||v.readyState<2) return; try{const r=await det.detect(v); if(r[0]) gotBarcode(r[0].rawValue)}catch(_){}},250);
        return;
      }
    }
    const Z=await loadZxing(); if(!sheet||sheet.type!=='scan') return;
    const reader=new Z.BrowserMultiFormatReader();
    scan.zx=await reader.decodeFromConstraints({video:{facingMode:'environment'}},v,r=>{if(r&&!scan.busy) gotBarcode(r.getText())});
    if(!sheet||sheet.type!=='scan') stopScan();
  }catch(e){
    if(note) note.textContent=e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in the browser, or type the barcode number.':'Couldn’t start the camera. Type the barcode number instead.';
  }
}
function stopScan(){
  clearInterval(scan.timer); scan.timer=null; scan.busy=false;
  if(scan.zx){try{scan.zx.stop()}catch(_){} scan.zx=null}
  if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null}
}
async function gotBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(!code) return;
  scan.busy=true; if(navigator.vibrate) navigator.vibrate(40);
  const note=document.getElementById('scanNote'); if(note) note.innerHTML=`<span class="spin"></span>Looking up ${esc(code)}…`;
  const mine=foodByBarcode(code);
  if(mine){openSheet({type:'food',food:mine});return}
  try{
    const f=await offBarcode(code);
    if(!sheet||sheet.type!=='scan') return;
    if(f){openSheet({type:'food',food:rememberLookup(f)});return}
    toast('Not in Open Food Facts. Add it from the label.');
    openSheet({type:'editFood',food:{barcode:code},then:'log'});
  }catch(_){
    scan.busy=false; if(note) note.textContent=`Couldn’t reach Open Food Facts to look up ${code}. Check your connection and try again.`;
  }
}

/* ---------------- Logging ---------------- */
// Online results become library foods the first time they're logged
function keepFood(f){
  if(f.id) return f;
  const have=foodByExt(f.ext); if(have) return have;
  const rec={...f,id:'f'+uid6(),uses:0}; putRecord('foods',rec); return rec;
}
// opt.recipe marks the entry as part of a recipe log; those leave the food's own last portion alone
function logPortion(f,qty,unit,entryId,opt={}){
  f=keepFood(f);
  const amt=baseAmount(f,qty,unit), n=nutrientsFor(f,amt), old=entryId&&state.entries.find(x=>x.id===entryId), recipe=opt.recipe||old&&old.recipe;
  const rec={id:old?old.id:'e'+uid6(),date:old?old.date:day,ts:old?old.ts:opt.ts||nowIso(),foodId:f.id,name:f.name+(f.brand?` (${f.brand})`:''),
    qty,unit,unitLabel:unitLabel(f,unit),amt,...Object.fromEntries(METRICS.map(m=>[m.k,n[m.k]])),more:moreOf(n),...(recipe?{recipe}:{})};
  putRecord('entries',rec);
  if(recipe) return rec;
  Object.assign(f,{lastUnit:unit,lastQty:qty,lastAmt:amt,lastUsed:nowIso(),uses:(f.uses||0)+(old?0:1)}); putRecord('foods',f);
  const k=unitKind(unit); if(k!=='serving'&&state.settings.unitPrefs[k]!==unit){state.settings.unitPrefs[k]=unit; touchSettings()}
  return rec;
}

function toast(t){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
function saveWeighin(f){
  const d=f.get('date'), w=num(f.get('weight')), fat=num(f.get('fat'));
  if(!d||!w||w<=0){toast('Enter a weight.');return false}
  const old=weighinOn(d);
  putRecord('weighins',{id:old?old.id:'w'+uid6(),date:d,kg:+fromDisp(w).toFixed(3),fat:fat==null?null:fat});
  toast(old?'Weigh-in updated':'Weigh-in saved'); return true;
}
// Only boxes the user changed are recorded; untouched ones keep carrying their earlier check-in forward
function saveMeasures(form){
  const d=form.elements.date.value; if(!d){toast('Pick a date.');return false}
  const old=measureOn(d), v={...(old&&old.v||{})}; let changed=0;
  for(const el of form.querySelectorAll('input[name^="m_"]')){
    const k=el.name.slice(2); if(el.value===el.defaultValue) continue;
    const x=num(el.value);
    if(x==null||x<=0){if(k in v){delete v[k]; changed++} continue}
    v[k]=+fromLen(x).toFixed(2); changed++;
  }
  if(!changed){toast('Nothing changed. Adjust a measurement first.');return false}
  if(!Object.keys(v).length){if(old) dropRecord('measurements',old.id); toast('Measurements removed'); return true}
  putRecord('measurements',{id:old?old.id:'m'+uid6(),date:d,v});
  toast(`Saved ${changed} measurement${changed===1?'':'s'}`); return true;
}

  Drive.lastAsk=Date.now(); driveToken().then(()=>driveSync(false)).catch(()=>showDriveStatus());
},true);

  if(d.rmfood){const x=foodById(d.rmfood), rs=usedInRecipe(d.rmfood); dropRecord('foods',d.rmfood);
    toast(`Removed ${x?x.name:'food'}. Logged entries stay${rs.length?`; ${rs.map(r=>r.name).join(', ')} won’t include it`:''}.`); render(); return}
  if(d.overlay){let o=overlayKeys(); if(o.includes(d.overlay)) o=o.filter(k=>k!==d.overlay); else {if(o.length>=OVERLAY_COLORS.length){toast(`Up to ${OVERLAY_COLORS.length} measurements at a time.`);return} o.push(d.overlay)}
    state.settings.weightOverlay=o; touchSettings(); render(); return}
  if(d.rmmeasure){dropRecord('measurements',d.rmmeasure); toast('Measurements removed'); render(); return}
  if(d.lunit){state.settings.lengthUnit=d.lunit; touchSettings(); render(); return}
  if(d.rmweigh){dropRecord('weighins',d.rmweigh); toast('Weigh-in removed'); render(); return}
  if(d.wunit){state.settings.weightUnit=d.wunit; touchSettings(); render(); return}
  if(d.unitpref){const [k,u]=d.unitpref.split(':'); state.settings.unitPrefs[k]=u; touchSettings(); render(); return}
  if(d.act==='resetAsk'){pendingDelete='ALL';render();return}
  if(d.act==='resetNo'){pendingDelete=null;render();return}
  if(d.act==='resetYes'){
    const ids=LISTS.flatMap(k=>state[k]).map(x=>x.id);
    state={...emptyState(),deleted:state.deleted.concat(ids)}; touchSettings(); pendingDelete=null; toast('Everything erased'); render(); return}
  if(d.act==='driveConnect'||d.act==='driveSync'){driveSync(true);return}
  if(d.act==='driveOff'){driveDisconnect();return}
  if(d.act==='export'){
    const data=JSON.stringify(snapshot(),null,2);
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='nutrition-helper-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
    catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn’t available here')}}
    return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape') return; if(sheet) closeSheet(); else if(adder) closeAdder()});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='dayPick'&&t.value){day=t.value;render();return}
  if(t.id==='listSort'){listSort=t.value; try{localStorage.setItem('nh.listSort',listSort)}catch(_){} render(); return}
  if(t.id==='foodSort'){foodSort=t.value; try{sessionStorage.setItem('nh.foodSort',foodSort)}catch(_){} render(); return}
  if(t.id==='addMicro'&&t.value){readTargetsForm(); state.settings.micros.push({k:t.value,v:null,kind:MICRO_CEILING.has(t.value)?'ceiling':'floor'});
    touchSettings(); render(); const el=document.querySelector(`[name="v:${t.value}"]`); if(el) el.focus(); return}
  if(t.id==='mDate'&&t.value){document.getElementById('mFormHost').innerHTML=measureForm(t.value); drawLeaders(); return}
  if(t.dataset.site){const on=new Set(state.settings.measureSites||defaultSites()); t.checked?on.add(t.dataset.site):on.delete(t.dataset.site);
    state.settings.measureSites=SITES.map(x=>x[0]).filter(k=>on.has(k)); sitesOpen=true; touchSettings(); render(); return}
  // Switching units keeps the same amount of food: 100 g becomes 3.53 oz
  if(t.id==='pUnit'&&sheet&&sheet.type==='food'){
    const q=document.getElementById('pQty');
    const amt=baseAmount(sheet.food,num(q.value)||0,t.dataset.prev), one=baseAmount(sheet.food,1,t.value);
    if(amt>0&&one>0) q.value=fmtQty(amt/one);
    t.dataset.prev=t.value;
    document.getElementById('pPreview').innerHTML=previewHtml(sheet.food,q.value,t.value);
    const m=document.getElementById('pMore'); if(m) m.innerHTML=moreHtml(sheet.food,q.value,t.value); return}
  // Same for a food's unit in the recipe editor
  if(/^u\d+$/.test(t.name||'')&&t.closest('#recipeForm')&&sheet&&sheet.draft){
    const it=sheet.draft.items[+t.name.slice(1)], f=it&&foodById(it.foodId), q=t.form.elements['q'+t.name.slice(1)];
    if(f&&q){const amt=baseAmount(f,num(q.value)||0,t.dataset.prev), one=baseAmount(f,1,t.value); if(amt>0&&one>0) q.value=fmtQty(amt/one)}
    t.dataset.prev=t.value; syncDraft(); const el=document.getElementById('rSummary'); if(el) el.textContent=recipeSummary(sheet.draft); return}
  if(t.id==='mfFile'&&t.files[0]){const f=t.files[0]; t.value=''; startImport(f); return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(j.app!=='nutrition-helper') throw 0;
      const n=state.entries.length+state.weighins.length;
      mergeIn(j); saveLocal();
      toast(`Imported ${Math.max(0,state.entries.length+state.weighins.length-n)} new records`); render();
    }catch(_){toast('That file isn’t a Nutrition Helper backup.')}
    t.value='';
  }
});

let renderedToday=todayKey();
function render(){
  renderedToday=todayKey();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const v={today:viewToday,weight:viewWeight,body:viewBody,trends:viewTrends,foods:viewFoods,settings:viewSettings}[tab]||viewToday;
  const m=document.getElementById('main');
  m.innerHTML=v(); m.classList.toggle('has-fab',tab==='today'&&!adder);
  if(tab==='trends') drawCharts();
  if(tab==='body') drawLeaders();
  refreshAdder();
}

// Home-screen shortcuts open the app with ?do=log|scan|weigh
const launch=new URLSearchParams(location.search).get('do');
if(launch){
  history.replaceState(null,'',location.pathname+location.hash);
  tab=launch==='weigh'?'weight':'today';
  try{sessionStorage.setItem('nh.tab',tab)}catch(_){}
}
render();
if(launch==='log') openAdder(true);
if(launch==='scan'){openAdder(false); openSheet({type:'scan'})}
if(launch==='weigh'){const w=document.querySelector('#weighForm [name=weight]'); if(w) w.focus()}
showDriveStatus();
if(driveConfigured()&&Drive.on){
  GoogleToken.gis().catch(()=>{});    // ready for the next tap-to-renew
  if(driveLive()) driveSync(false);   // pick up changes made on other devices
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveLive()) driveSync(false)});
}
// The day rolls over while the app stays open on a phone
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||day!==renderedToday||day===todayKey()||sheet||adder) return; day=todayKey(); render()});
</script>
